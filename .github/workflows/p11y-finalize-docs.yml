name: APSIS Phase 11Y one-shot documentation finalizer

on:
  push:
    branches:
      - p11y-fdn-output-addsub-proof-staging
    paths:
      - .github/workflows/p11y-finalize-docs.yml

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Update frozen P11Y state blocks
        run: python3 ci/p11y_finalize_docs.py
      - name: Validate documentation diff
        run: |
          git diff --check
          git diff -- ROADMAP.md PROJECT_STATE.md
      - name: Commit frozen documentation state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md PROJECT_STATE.md
          git commit -m 'phase11y: freeze rejection and P11Z closure state'
          git push origin HEAD:p11y-fdn-output-addsub-proof-staging
