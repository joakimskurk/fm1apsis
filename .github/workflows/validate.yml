name: APSIS staged validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  phase1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi Linux toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"

      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Gate 1 - source core and pinned upstream
        run: bash ci/prepare_dinghy.sh

      - name: Gate 2 - unchanged Dinghy host and target
        run: bash ci/build_baseline.sh

      - name: Gate 3 - APSIS overlay and host shell
        run: bash ci/apply_apsis.sh

      - name: Gate 4 - APSIS target package and identity
        run: bash ci/build_apsis_target.sh

      - name: Gate 5 - FM-1 emulator smoke
        shell: bash
        run: |
          set -o pipefail
          bash ci/emulator_smoke.sh build/apsis-0.1-dev.fwsc 2>&1 | tee build/evidence/emulator_smoke.txt
          cp -a work/emu-smoke build/evidence/emulator-smoke

      - name: Gate 5b - Clock DSP bypass preserves frozen M4d PCM
        shell: bash
        run: |
          set -euo pipefail
          cp build/target_report.json build/evidence/m4e-default-target-report.json
          cp build/SHA256SUMS build/evidence/m4e-default-SHA256SUMS
          cp build/apsis-0.1-dev.fwsc build/m4e-default-fw-backup.fwsc

          APSIS_CI_CLOCK_DSP_OFF=1 APSIS_VERSION=0.1-dev bash ci/apply_apsis.sh
          APSIS_VERSION=0.1-dev bash ci/build_apsis_target.sh
          cp build/target_report.json build/evidence/m4e-clock-bypass-target-report.json
          cp build/SHA256SUMS build/evidence/m4e-clock-bypass-SHA256SUMS

          set -o pipefail
          bash ci/emulator_smoke.sh build/apsis-0.1-dev.fwsc 2>&1 \
            | tee build/evidence/emulator_clock_bypass.txt
          cp -a work/emu-smoke build/evidence/emulator-smoke-clock-bypass

          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('work/emu-smoke/report.json').read_text())
          expected_pcm = '539e4192134d62d5f941ea21111157f763e92d0db5007f8157ca023db7c975f7'
          if report.get('wav_raw_sha256') != expected_pcm:
              raise SystemExit(
                  'FAIL: M4e Clock DSP bypass changed frozen M4d PCM: '
                  f"{report.get('wav_raw_sha256')} != {expected_pcm}"
              )
          if report.get('runtime_queue_high_water') != 28:
              raise SystemExit(
                  f"FAIL: M4e bypass queue high-water {report.get('runtime_queue_high_water')} != 28"
              )
          if report.get('runtime_queue_overflowed') != 0:
              raise SystemExit('FAIL: M4e bypass runtime queue overflow')
          if report.get('runtime_late_flags') != 0:
              raise SystemExit(
                  f"FAIL: M4e bypass late flags {report.get('runtime_late_flags')}"
              )
          if report.get('runtime_cursor_low32') != 123648:
              raise SystemExit(
                  f"FAIL: M4e bypass cursor {report.get('runtime_cursor_low32')} != 123648"
              )
          if report.get('runtime_late_trace_hash') != '811c9dc5':
              raise SystemExit(
                  'FAIL: M4e bypass late trace '
                  f"{report.get('runtime_late_trace_hash')} != 811c9dc5"
              )
          print('PASS: M4e Clock DSP bypass preserves frozen M4d PCM/runtime')
          PY

          cp build/m4e-default-fw-backup.fwsc build/apsis-0.1-dev.fwsc
          cp build/evidence/m4e-default-target-report.json build/target_report.json
          cp build/evidence/m4e-default-SHA256SUMS build/SHA256SUMS
          rm -f build/m4e-default-fw-backup.fwsc

      - name: Upload Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-evidence
          path: build/evidence
          if-no-files-found: warn

      - name: Upload development firmware
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apsis-dev-firmware
          path: |
            build/apsis-0.1-dev.fwsc
            build/SHA256SUMS
            build/target_report.json
          if-no-files-found: error
