name: APSIS Phase 9 controls

on:
  push:
    branches: [p9-controls]
  pull_request:
  workflow_dispatch:

jobs:
  control-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: P9A/P9B/P9C/P9D source-locked interaction contract
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            apsis/apsis_harmony.c apsis/apsis_string.c apsis/apsis_controls.c \
            tests/test_controls.c -o /tmp/test_controls
          /tmp/test_controls
      - name: P9A/P9B/P9C/P9D ASAN/UBSAN
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis \
            apsis/apsis_harmony.c apsis/apsis_string.c apsis/apsis_controls.c \
            tests/test_controls.c -o /tmp/test_controls_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_controls_san
      - name: P9E BLOOM source-locked performance/parameter contract
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            apsis/apsis_harmony.c apsis/apsis_bloom.c apsis/apsis_controls_bloom.c \
            tests/test_controls_bloom.c -o /tmp/test_controls_bloom
          /tmp/test_controls_bloom
      - name: P9E BLOOM ASAN/UBSAN
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis \
            apsis/apsis_harmony.c apsis/apsis_bloom.c apsis/apsis_controls_bloom.c \
            tests/test_controls_bloom.c -o /tmp/test_controls_bloom_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_controls_bloom_san
