name: APSIS Phase 9 controls

on:
  push:
    branches: [p9-controls]
  pull_request:
  workflow_dispatch:

jobs:
  control-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: P9A/P9B FM-1 interaction contract
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            apsis/apsis_controls.c tests/test_controls.c -o /tmp/test_controls
          /tmp/test_controls
      - name: P9A/P9B ASAN/UBSAN
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis \
            apsis/apsis_controls.c tests/test_controls.c -o /tmp/test_controls_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_controls_san
