name: APSIS Phase 12A frozen-package preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p12a-package-preflight.yml'
      - 'apsis/**'
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p12a-package-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: Guard exact frozen P11W production authority
        run: |
          set -euo pipefail
          test "$(git hash-object apsis/apsis_space_dsp.c)" = '3bcd294dd9fb610df888ddd0517da7de3bf4c086'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = 'ec221e22aeb6670ec628cbb0cc7c7eea91038554'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          echo 'PASS: Phase 12A preflight starts from exact frozen P11W production source'

      - name: Prepare pinned Dinghy checkout
        run: bash ci/prepare_dinghy.sh

      - name: JieLi Linux toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"

      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Build frozen P11W target package from current head
        run: |
          set -euo pipefail
          bash ci/apply_apsis_p10g.sh
          bash ci/build_apsis_target.sh

      - name: Verify exact Phase 12 entry package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('build/target_report.json').read_text())
          expected = {
              'product': 'FM-1_972',
              'image': 140472,
              'image_max': 581564,
              'ram': 87524,
              'ram_max': 98304,
              'pool': 319176,
              'pool_max': 344064,
              'ram_headroom': 10780,
              'pool_headroom': 24888,
              'package_bytes': 610110,
              'package_sha256': 'f9ca07eaee94843dcfa94ee7d05cdfade412ef221a1a8984243454a095ee3168',
          }
          for key, value in expected.items():
              actual = report.get(key)
              if actual != value:
                  raise SystemExit(f'FAIL: {key}={actual!r} != frozen {value!r}')
          print('PASS: exact frozen P11W Phase-12 entry package regenerated', report)
          PY

          test -f build/apsis-0.1-dev.fwsc
          sha256sum build/apsis-0.1-dev.fwsc
          grep -q 'f9ca07eaee94843dcfa94ee7d05cdfade412ef221a1a8984243454a095ee3168' build/SHA256SUMS

      - name: Stage install package evidence
        run: |
          set -euo pipefail
          mkdir -p build/p12a-package
          cp build/apsis-0.1-dev.fwsc build/p12a-package/
          cp build/target_report.json build/p12a-package/
          cp build/SHA256SUMS build/p12a-package/
          git rev-parse HEAD > build/p12a-package/repo-head.txt
          printf '%s\n' 'Frozen authority: Phase 11 P11W' > build/p12a-package/AUTHORITY.txt
          printf '%s\n' 'Expected package SHA-256: f9ca07eaee94843dcfa94ee7d05cdfade412ef221a1a8984243454a095ee3168' >> build/p12a-package/AUTHORITY.txt

      - name: Upload Phase 12A frozen install package
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apsis-p12a-frozen-p11w-package
          path: build/p12a-package
          if-no-files-found: error
