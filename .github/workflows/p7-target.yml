name: APSIS Phase 7 target persistence

on:
  pull_request:
  workflow_dispatch:

jobs:
  p7-target:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi Linux toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"

      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Gate P7.1 - pinned upstream
        run: bash ci/prepare_dinghy.sh

      - name: Gate P7.2 - generated persistence target
        run: bash ci/apply_apsis_p7.sh

      - name: Gate P7.3 - real JieLi target build
        run: |
          bash ci/build_apsis_target.sh
          mkdir -p build/evidence
          cp build/target_report.json build/evidence/p7-target-report.json
          cp build/SHA256SUMS build/evidence/p7-SHA256SUMS
          cp build/apsis-0.1-dev.fwsc build/p7-audible-fw-backup.fwsc
          python3 - <<'PY'
          import json
          from pathlib import Path
          t = json.loads(Path('build/target_report.json').read_text())
          if t.get('product') != 'FM-1_972':
              raise SystemExit(f"FAIL: P7 product {t.get('product')!r}")
          if t.get('ram', 0) > t.get('ram_max', 0):
              raise SystemExit(f"FAIL: P7 RAM {t.get('ram')}/{t.get('ram_max')}")
          if t.get('pool', 0) > t.get('pool_max', 0):
              raise SystemExit(f"FAIL: P7 POOL {t.get('pool')}/{t.get('pool_max')}")
          print(f"PASS: P7 target fits RAM={t.get('ram')}/{t.get('ram_max')} POOL={t.get('pool')}/{t.get('pool_max')}")
          PY

      - name: Gate P7.4 - empty-flash boot preserves frozen P6 audio/runtime
        shell: bash
        run: |
          set -euo pipefail
          APSIS_EMU_EXPECT_CURSOR=123392 \
            bash ci/emulator_smoke.sh build/apsis-0.1-dev.fwsc 2>&1 \
            | tee build/evidence/emulator_p7_audible.txt
          cp -a work/emu-smoke build/evidence/emulator-smoke-p7-audible
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('work/emu-smoke/report.json').read_text())
          expected_pcm = 'c4fa18954cd5d5ecc895ec9457d673b8bdbe0f946c0d2aa3efa3d28f77c60f93'
          if r.get('wav_raw_sha256') != expected_pcm:
              raise SystemExit(f"FAIL: P7 changed frozen P6 PCM {r.get('wav_raw_sha256')} != {expected_pcm}")
          expected = {
              'runtime_queue_high_water': 28,
              'runtime_queue_overflowed': 0,
              'runtime_late_flags': 0,
              'runtime_cursor_low32': 123392,
          }
          for k, v in expected.items():
              if r.get(k) != v:
                  raise SystemExit(f'FAIL: P7 {k}={r.get(k)!r} != {v!r}')
          print('PASS: P7 empty-flash boot is bit-exact P6 audio with frozen runtime telemetry')
          PY

      - name: Gate P7.5 - dry-only path remains exact Phase 5
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          APSIS_CI_SPACE_DRY_ONLY=1 bash ci/apply_apsis_p7.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json build/evidence/p7-dry-target-report.json
          set -o pipefail
          APSIS_EMU_EXPECT_CURSOR=123392 \
            bash ci/emulator_smoke.sh build/apsis-0.1-dev.fwsc 2>&1 \
            | tee build/evidence/emulator_p7_dry.txt
          cp -a work/emu-smoke build/evidence/emulator-smoke-p7-dry
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('work/emu-smoke/report.json').read_text())
          expected_pcm = '6c3b8fff90f381da36ade0e610efb85769b04a020d17333308866e95055caa2b'
          if r.get('wav_raw_sha256') != expected_pcm:
              raise SystemExit(f"FAIL: P7 dry PCM {r.get('wav_raw_sha256')} != {expected_pcm}")
          if r.get('runtime_cursor_low32') != 123392 or r.get('runtime_late_flags') != 0 or r.get('runtime_queue_overflowed') != 0:
              raise SystemExit(f'FAIL: P7 dry runtime telemetry {r}')
          print('PASS: P7 dry-only remains exact frozen Phase-5 PCM')
          PY
          cp build/p7-audible-fw-backup.fwsc build/apsis-0.1-dev.fwsc
          cp build/evidence/p7-target-report.json build/target_report.json

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p7-target-evidence
          path: build/evidence
          if-no-files-found: warn

      - name: Upload Phase 7 firmware
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apsis-p7-firmware
          path: |
            build/apsis-0.1-dev.fwsc
            build/target_report.json
          if-no-files-found: error