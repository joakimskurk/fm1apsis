name: APSIS one-shot archive legacy target replay gates

on:
  push:
    branches: [p11-optimization]
    paths:
      - .github/workflows/p11-archive-legacy-target-gates.yml

permissions:
  contents: write

jobs:
  archive-legacy-target-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Make historical target replays manual-only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manual = '''on:\n  # Historical target replay is timing-coupled to its phase-era binary shape.\n  # Keep the original replay/hash assertions intact, but run them manually.\n  # Live later-phase PR validation is covered by core + P9/P10/P11Z gates.\n  workflow_dispatch:\n'''
          old_simple = '''on:\n  pull_request:\n  workflow_dispatch:\n'''
          for name in ('p6-final.yml', 'p7-target.yml', 'p8-target.yml'):
              p = Path('.github/workflows') / name
              s = p.read_text()
              if s.count(old_simple) != 1:
                  raise SystemExit(f'{p}: trigger anchor mismatch')
              p.write_text(s.replace(old_simple, manual, 1))
          p = Path('.github/workflows/validate.yml')
          s = p.read_text()
          old = '''on:\n  push:\n    branches: [main]\n  pull_request:\n  workflow_dispatch:\n'''
          if s.count(old) != 1:
              raise SystemExit('validate.yml: trigger anchor mismatch')
          p.write_text(s.replace(old, manual, 1))
          print('PASS: legacy timing-coupled target replay gates are manual-only')
          PY
      - name: Validate trigger-only migration
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/p6-final.yml \
            .github/workflows/p7-target.yml \
            .github/workflows/p8-target.yml \
            .github/workflows/validate.yml | sort)"
          test "$changed" = "$expected"
          git diff -- .github/workflows/p6-final.yml .github/workflows/p7-target.yml .github/workflows/p8-target.yml .github/workflows/validate.yml
      - name: Commit archival trigger migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/p6-final.yml .github/workflows/p7-target.yml .github/workflows/p8-target.yml .github/workflows/validate.yml
          git commit -m 'ci: archive timing-coupled legacy target replay gates'
          git push origin HEAD:p11-optimization
