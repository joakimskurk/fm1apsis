name: APSIS one-shot archive legacy target replay gates

on:
  push:
    branches: [p11-ci-compat-staging]
    paths:
      - .github/workflows/p11-archive-legacy-target-gates.yml

permissions:
  contents: write

jobs:
  archive-legacy-target-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Make historical target replays manual-only
        run: python3 ci/p11_archive_legacy_target_gates.py
      - name: Validate workflow-only diff
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --name-only -- apsis tests ci | grep -v '^$' || true)"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/p6-final.yml \
            .github/workflows/p7-target.yml \
            .github/workflows/p8-target.yml \
            .github/workflows/validate.yml | sort)"
          test "$changed" = "$expected"
          git diff -- .github/workflows/p6-final.yml .github/workflows/p7-target.yml .github/workflows/p8-target.yml .github/workflows/validate.yml
      - name: Commit archival trigger migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/p6-final.yml .github/workflows/p7-target.yml .github/workflows/p8-target.yml .github/workflows/validate.yml
          git commit -m 'ci: archive timing-coupled legacy target replay gates'
          git push origin HEAD:p11-ci-compat-staging
