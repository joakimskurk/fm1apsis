name: APSIS Phase 11M FDN inner-loop branch census

on:
  push:
    branches: [p11m-fdn-innerloop-census-staging]
  workflow_dispatch:

jobs:
  p11m-census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Generate test-only instrumented FDN source
        run: python3 ci/p11m_instrument_sources.py --out /tmp/p11m-src

      - name: Gate P11M.1 - deterministic cold and warm branch census
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iapsis -Itests \
            /tmp/p11m-src/apsis_space_dsp.c \
            tests/test_p11m_fdn_innerloop_census.c \
            -o /tmp/test_p11m_fdn_innerloop_census
          /tmp/test_p11m_fdn_innerloop_census | tee /tmp/p11m-census.log
          grep -q 'PASS: P11M FDN inner-loop branch census' /tmp/p11m-census.log
          grep -q 'scenario=cold frames=16384 sine_calls=131072' /tmp/p11m-census.log
          grep -q 'scenario=warm frames=65536 sine_calls=524288' /tmp/p11m-census.log
          grep -q 'scenario=warm .*line_calls=524288' /tmp/p11m-census.log
          grep -q 'scenario=warm .*clamp_opportunities=0 .*not_ready=0 .*full_line_calls=524288' /tmp/p11m-census.log
          grep -q 'scenario=warm .*upper_wrap=0' /tmp/p11m-census.log

      - name: Gate P11M.2 - census under ASAN and UBSAN
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis -Itests \
            /tmp/p11m-src/apsis_space_dsp.c \
            tests/test_p11m_fdn_innerloop_census.c \
            -o /tmp/test_p11m_fdn_innerloop_census_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_p11m_fdn_innerloop_census_san | tee /tmp/p11m-census-san.log
          grep -q 'PASS: P11M FDN inner-loop branch census' /tmp/p11m-census-san.log

      - name: Gate P11M.3 - production Space sources remain exact P11L authority
        run: |
          set -euo pipefail
          test "$(git hash-object apsis/apsis_space_dsp.c)" = '0c472f3844210f0dfb3d31bf6dacf007272ac078'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = '71afae3c4c52bbd735121597dfa7ad6cea4f32f5'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          echo 'PASS: P11M instrumentation is test-only; P11L production Space sources are untouched'
