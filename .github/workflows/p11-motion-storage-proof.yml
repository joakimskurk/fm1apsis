name: APSIS Phase 11B Motion storage proof

on:
  push:
    branches: [p11-optimization]
  pull_request:
  workflow_dispatch:

jobs:
  p11b-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Gate P11B.1 - per-lane pitch-context equivalence proof
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            apsis/apsis_state.c apsis/apsis_harmony.c apsis/apsis_gravity.c \
            apsis/apsis_string.c apsis/apsis_string_motion.c \
            tests/test_p11_motion_storage_proof.c \
            -o /tmp/test_p11_motion_storage_proof
          /tmp/test_p11_motion_storage_proof | tee /tmp/p11b-proof.txt
      - name: Gate P11B.2 - proof under ASAN/UBSAN
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis \
            apsis/apsis_state.c apsis/apsis_harmony.c apsis/apsis_gravity.c \
            apsis/apsis_string.c apsis/apsis_string_motion.c \
            tests/test_p11_motion_storage_proof.c \
            -o /tmp/test_p11_motion_storage_proof_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_p11_motion_storage_proof_san
      - name: Upload P11B proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11b-motion-storage-proof
          path: /tmp/p11b-proof.txt
          if-no-files-found: error
