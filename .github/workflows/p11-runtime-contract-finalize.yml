name: APSIS Phase 11 one-shot runtime contract finalizer

on:
  push:
    branches:
      - p11-optimization
    paths:
      - .github/workflows/p11-runtime-contract-finalize.yml

permissions:
  contents: write

jobs:
  finalize-runtime-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Permanently freeze P11F runtime-size tests
        run: python3 ci/p11_fix_runtime_contract.py
      - name: Validate intended diff only
        run: |
          git diff --check
          test -z "$(git diff --name-only -- apsis)"
          git diff -- tests/test_bloom_audio_live.c tests/test_string_attractor_runtime.c tests/test_string_rhythm_observer.c ci/p11f_prepare.sh
      - name: Commit permanent test contract
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_bloom_audio_live.c tests/test_string_attractor_runtime.c tests/test_string_rhythm_observer.c ci/p11f_prepare.sh
          git commit -m 'phase11: freeze reduced ApsisRuntime size in permanent tests'
          git push origin HEAD:p11-optimization
