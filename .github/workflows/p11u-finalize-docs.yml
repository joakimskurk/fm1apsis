name: APSIS Phase 11U one-shot documentation finalizer

on:
  push:
    branches:
      - p11u-fdn-residual-workload-inventory-staging
    paths:
      - .github/workflows/p11u-finalize-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Freeze P11U documentation
        run: |
          set -euo pipefail
          python3 ci/p11u_finalize_docs.py
          git diff --check
          git diff --exit-code -- apsis/apsis_space_dsp.c apsis/apsis_space_dsp.h apsis/apsis_space_room.c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md PROJECT_STATE.md
          git diff --cached --check
          git commit -m 'phase11u: freeze residual inventory and authorize P11V proof'
          git push
