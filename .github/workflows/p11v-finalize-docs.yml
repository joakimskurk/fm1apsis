name: APSIS Phase 11V one-shot documentation finalizer

on:
  push:
    branches:
      - p11v-fdn-sine-delta-cache-proof-staging
    paths:
      - .github/workflows/p11v-finalize-docs.yml

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Update frozen P11V state
        run: python3 ci/p11v_finalize_docs.py
      - name: Validate documentation diff
        run: |
          git diff --check
          git diff -- ROADMAP.md PROJECT_STATE.md docs/PHASE11_FDN_SINE_DELTA_CACHE_PROOF.md
      - name: Commit frozen P11V documentation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md PROJECT_STATE.md docs/PHASE11_FDN_SINE_DELTA_CACHE_PROOF.md
          git commit -m 'phase11v: freeze proof projection state after green run'
          git push origin HEAD:p11v-fdn-sine-delta-cache-proof-staging
