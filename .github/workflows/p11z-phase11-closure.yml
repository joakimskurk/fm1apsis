name: APSIS Phase 11Z final closure matrix

on:
  push:
    branches: [p11z-phase11-closure-staging]
  workflow_dispatch:

jobs:
  p11z-closure:
    runs-on: ubuntu-24.04
    env:
      P11Z_EVIDENCE: /tmp/p11z-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Python packages
        run: python3 -m pip install Pillow
      - name: Initialize closure evidence
        run: |
          rm -rf "$P11Z_EVIDENCE"
          mkdir -p "$P11Z_EVIDENCE/capacity"

      - name: Gate P11Z.1 - accepted production authority remains exact P11W
        run: |
          set -euo pipefail
          test "$(git hash-object apsis/apsis_space_dsp.c)" = '3bcd294dd9fb610df888ddd0517da7de3bf4c086'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = 'ec221e22aeb6670ec628cbb0cc7c7eea91038554'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          echo 'PASS: P11Z closure starts from exact accepted P11W production source' \
            | tee "$P11Z_EVIDENCE/production-authority.log"

      - name: Gate P11Z.2 - complete historical host and sanitizer behavior
        run: |
          set -euo pipefail
          bash ci/p11f_prepare.sh | tee "$P11Z_EVIDENCE/historical-prepare.log"
          echo 'PASS: complete historical host/sanitizer behavior remains green' \
            | tee "$P11Z_EVIDENCE/historical-pass.log"

      - name: Gate P11Z.3 - current bounded-capacity and high-water closure
        run: |
          set -euo pipefail
          build/test_runtime | tee "$P11Z_EVIDENCE/capacity/runtime.log"
          build/test_runtime_extreme | tee "$P11Z_EVIDENCE/capacity/runtime_extreme.log"
          build/test_string_attractor_runtime | tee "$P11Z_EVIDENCE/capacity/string_attractor_runtime.log"
          build/test_string_transient | tee "$P11Z_EVIDENCE/capacity/string_transient.log"
          build/test_string_body_transient | tee "$P11Z_EVIDENCE/capacity/string_body_transient.log"
          build/test_clock_dsp | tee "$P11Z_EVIDENCE/capacity/clock_dsp.log"

          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            build/apsis_*.o \
            apsis/apsis_spiral_audio.c apsis/apsis_spiral_dsp.c \
            tests/test_spiral_dsp.c -o /tmp/p11z_spiral_dsp
          /tmp/p11z_spiral_dsp | tee "$P11Z_EVIDENCE/capacity/spiral_dsp.log"

          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            build/apsis_*.o \
            apsis/apsis_bloom_audio.c apsis/apsis_bloom_dsp.c \
            tests/test_bloom_dsp.c -o /tmp/p11z_bloom_dsp
          /tmp/p11z_bloom_dsp | tee "$P11Z_EVIDENCE/capacity/bloom_dsp.log"

          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            build/apsis_*.o tests/test_p11_bloom_slot_bound.c \
            -o /tmp/p11z_bloom_bound
          /tmp/p11z_bloom_bound | tee "$P11Z_EVIDENCE/capacity/bloom_bound.log"

          python3 - <<'PY' | tee "$P11Z_EVIDENCE/capacity/quick-assert.log"
          from pathlib import Path
          root=Path('/tmp/p11z-evidence/capacity')
          rt=(root/'runtime.log').read_text()
          ex=(root/'runtime_extreme.log').read_text()
          at=(root/'string_attractor_runtime.log').read_text()
          bound=(root/'bloom_bound.log').read_text()
          assert 'sizeof=21032' in rt, rt
          assert 'queue=357/512' in ex and 'spiral-slots=59/64' in ex and 'bloom-slots=44/48' in ex, ex
          assert 'queue=415/512, pending=60/64' in at, at
          assert 'proven_max=44 current_cap=48' in bound, bound
          print('PASS: P11Z current scheduler/capacity authority remains frozen')
          PY

      - name: JieLi Linux toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Gate P11Z.4 - exact accepted P11W real-target package
        run: |
          set -euo pipefail
          bash ci/apply_apsis_p10g.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json "$P11Z_EVIDENCE/production-target.json"
          cp build/SHA256SUMS "$P11Z_EVIDENCE/production-SHA256SUMS"
          ELF=work/apsis/build/dinghy.elf
          OBJDUMP="${JIELI_TOOLCHAIN:?}/common/bin/objdump"
          "$OBJDUMP" -t "$ELF" > "$P11Z_EVIDENCE/production-symbols.txt"
          "$OBJDUMP" -d "$ELF" > "$P11Z_EVIDENCE/production-disassembly.txt"
          python3 - <<'PY' | tee "$P11Z_EVIDENCE/production-target-check.log"
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'ci')
          import p11_workload_inventory as inv
          r=json.load(open('build/target_report.json'))
          expected={
              'product':'FM-1_972','image':140472,'image_max':581564,
              'ram':87524,'ram_max':98304,'pool':319176,'pool_max':344064,
              'ram_headroom':10780,'pool_headroom':24888,'package_bytes':610110,
              'package_sha256':'f9ca07eaee94843dcfa94ee7d05cdfade412ef221a1a8984243454a095ee3168',
          }
          for k,v in expected.items(): assert r[k] == v, (k,r[k],v,r)
          symbols=inv.parse_symbols(Path('/tmp/p11z-evidence/production-symbols.txt').read_text(errors='replace'))
          insns=inv.parse_disassembly(Path('/tmp/p11z-evidence/production-disassembly.txt').read_text(errors='replace'))
          assert symbols.get('apsis_space_fdn_render') == 1094, symbols.get('apsis_space_fdn_render')
          assert insns.get('apsis_space_fdn_render') == 364, insns.get('apsis_space_fdn_render')
          print('PASS: P11Z accepted P11W target/package/code-shape exactly regenerated', r)
          PY

      - name: Gate P11Z.5 - exact frozen idle PCM/runtime
        run: |
          set -euo pipefail
          APSIS_EMU_DYNAMIC_HOME=1 APSIS_EMU_EXPECT_CURSOR=123392 \
            bash ci/emulator_smoke.sh build/apsis-0.1-dev.fwsc 2>&1 \
            | tee "$P11Z_EVIDENCE/idle.log"
          cp work/emu-smoke/report.json "$P11Z_EVIDENCE/idle-report.json"
          python3 - <<'PY'
          import json
          r=json.load(open('work/emu-smoke/report.json'))
          assert r['wav_raw_sha256'] == 'c4fa18954cd5d5ecc895ec9457d673b8bdbe0f946c0d2aa3efa3d28f77c60f93', r
          assert r['runtime_cursor_low32'] == 123392, r
          assert r['runtime_queue_high_water'] == 28, r
          assert r['runtime_queue_overflowed'] == 0, r
          assert r['runtime_late_flags'] == 0, r
          assert r['runtime_late_trace_hash'] == '811c9dc5', r
          print('PASS: P11Z exact frozen idle PCM/runtime')
          PY

      - name: Gate P11Z.6 - exact frozen active Motion target and lifecycle
        run: |
          set -euo pipefail
          bash ci/p11f_prepare.sh
          bash ci/apply_apsis_p10d3_probe.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json "$P11Z_EVIDENCE/active-target.json"
          cp build/SHA256SUMS "$P11Z_EVIDENCE/active-SHA256SUMS"
          python3 - <<'PY' | tee "$P11Z_EVIDENCE/active-target-check.log"
          import json
          r=json.load(open('build/target_report.json'))
          expected={
              'product':'FM-1_972','image':137736,'image_max':581564,
              'ram':87572,'ram_max':98304,'pool':319176,'pool_max':344064,
              'ram_headroom':10732,'pool_headroom':24888,'package_bytes':610110,
              'package_sha256':'4685179ba074dfa090fc3a0603830d50c40cddae8dca97755f144cd0a885af63',
          }
          for k,v in expected.items(): assert r[k] == v, (k,r[k],v,r)
          print('PASS: P11Z exact P11W active target regenerated', r)
          PY
          bash ci/emulator_motion_active.sh build/apsis-0.1-dev.fwsc 2>&1 \
            | tee "$P11Z_EVIDENCE/active-motion.log"
          cp work/emu-motion-active/report.json "$P11Z_EVIDENCE/active-motion-report.json"
          cp work/emu-motion-active/apsis-motion.wav "$P11Z_EVIDENCE/active-motion.wav"

      - name: Gate P11Z.7 - consolidate final Phase-11 closure report
        run: |
          set -euo pipefail
          python3 ci/p11z_closure_report.py \
            --runtime "$P11Z_EVIDENCE/capacity/runtime_extreme.log" \
            --attractor "$P11Z_EVIDENCE/capacity/string_attractor_runtime.log" \
            --string "$P11Z_EVIDENCE/capacity/string_transient.log" \
            --body "$P11Z_EVIDENCE/capacity/string_body_transient.log" \
            --clock "$P11Z_EVIDENCE/capacity/clock_dsp.log" \
            --spiral "$P11Z_EVIDENCE/capacity/spiral_dsp.log" \
            --bloom "$P11Z_EVIDENCE/capacity/bloom_dsp.log" \
            --bloom-bound "$P11Z_EVIDENCE/capacity/bloom_bound.log" \
            --target "$P11Z_EVIDENCE/production-target.json" \
            --idle "$P11Z_EVIDENCE/idle-report.json" \
            --active-target "$P11Z_EVIDENCE/active-target.json" \
            --active "$P11Z_EVIDENCE/active-motion-report.json" \
            --out-json "$P11Z_EVIDENCE/closure.json" \
            --out-md "$P11Z_EVIDENCE/closure.md" \
            | tee "$P11Z_EVIDENCE/closure.log"
          cat "$P11Z_EVIDENCE/closure.md"

      - name: Gate P11Z.8 - closure branch contains no production mutation
        run: |
          set -euo pipefail
          test "$(git hash-object apsis/apsis_space_dsp.c)" = '3bcd294dd9fb610df888ddd0517da7de3bf4c086'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = 'ec221e22aeb6670ec628cbb0cc7c7eea91038554'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          echo 'PASS: P11Z is closure-only; production remains exact P11W' \
            | tee "$P11Z_EVIDENCE/no-production-mutation.log"

      - name: Upload P11Z closure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11z-phase11-closure-evidence
          path: /tmp/p11z-evidence
          if-no-files-found: error
