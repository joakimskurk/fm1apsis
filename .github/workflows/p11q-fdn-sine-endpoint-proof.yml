name: APSIS Phase 11Q FDN sine endpoint-cache proof

on:
  push:
    branches: [p11q-fdn-sine-endpoint-cache-proof-staging]
    paths:
      - tests/test_p11q_fdn_sine_endpoint_cache_equivalence.c
      - ci/p11q_apply_sine_endpoint_candidate.py
      - .github/workflows/p11q-fdn-sine-endpoint-proof.yml
  workflow_dispatch:

jobs:
  p11q-proof:
    runs-on: ubuntu-24.04
    env:
      P11Q_EVIDENCE: /tmp/p11q-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Python packages
        run: python3 -m pip install Pillow
      - name: Initialize proof evidence and freeze production authority
        run: |
          set -euo pipefail
          rm -rf "$P11Q_EVIDENCE"
          mkdir -p "$P11Q_EVIDENCE"
          test "$(git hash-object apsis/apsis_space_dsp.c)" = 'de554864167e410f69260a3d3720698b4ae456a7'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = '71afae3c4c52bbd735121597dfa7ad6cea4f32f5'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          git rev-parse HEAD | tee "$P11Q_EVIDENCE/head.txt"
          echo 'PASS: P11Q repo production Space is exact P11O before proof/projection' \
            | tee "$P11Q_EVIDENCE/source-freeze.log"

      - name: Gate P11Q.1 - exhaustive and complete-FDN equivalence
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            tests/test_p11q_fdn_sine_endpoint_cache_equivalence.c \
            -o /tmp/test_p11q_fdn_sine_endpoint_cache
          /tmp/test_p11q_fdn_sine_endpoint_cache \
            | tee "$P11Q_EVIDENCE/proof.log"
          grep -q 'P11Q top16 helper equivalence cases=65536' "$P11Q_EVIDENCE/proof.log"
          grep -q 'P11Q index transition equivalence cases=262144 incl_255_to_0=true' "$P11Q_EVIDENCE/proof.log"
          grep -q 'P11Q cold blocks=256 frames=16384' "$P11Q_EVIDENCE/proof.log"
          grep -q 'P11Q warm blocks=1024 frames=65536' "$P11Q_EVIDENCE/proof.log"
          grep -q 'random_blocks=4096' "$P11Q_EVIDENCE/proof.log"
          grep -q 'PASS: P11Q FDN sine endpoint-cache proof is bit-identical' "$P11Q_EVIDENCE/proof.log"

      - name: Gate P11Q.2 - sanitizer equivalence
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis \
            tests/test_p11q_fdn_sine_endpoint_cache_equivalence.c \
            -o /tmp/test_p11q_fdn_sine_endpoint_cache_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_p11q_fdn_sine_endpoint_cache_san \
            | tee "$P11Q_EVIDENCE/proof-san.log"
          grep -q 'PASS: P11Q FDN sine endpoint-cache proof is bit-identical' "$P11Q_EVIDENCE/proof-san.log"

      - name: JieLi Linux toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"

      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Gate P11Q.3 - regenerate exact P11O target baseline
        run: |
          set -euo pipefail
          bash ci/p11f_prepare.sh
          bash ci/apply_apsis_p10g.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json "$P11Q_EVIDENCE/baseline-target.json"
          cp build/SHA256SUMS "$P11Q_EVIDENCE/baseline-SHA256SUMS"
          ELF=work/apsis/build/dinghy.elf
          OBJDUMP="${JIELI_TOOLCHAIN:?}/common/bin/objdump"
          "$OBJDUMP" -t "$ELF" > "$P11Q_EVIDENCE/baseline-symbols.txt"
          "$OBJDUMP" -d "$ELF" > "$P11Q_EVIDENCE/baseline-disassembly.txt"
          python3 - <<'PY' | tee "$P11Q_EVIDENCE/baseline-check.log"
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'ci')
          import p11_workload_inventory as inv
          r=json.load(open('build/target_report.json'))
          expected={
              'product':'FM-1_972','image':140440,'ram':87492,'pool':319176,
              'ram_headroom':10812,'pool_headroom':24888,'package_bytes':610110,
              'package_sha256':'0a3c1ecc8adf99a625979e1a5369c3cad1f4a87264a227a7feefba3388da98a2',
          }
          for k,v in expected.items(): assert r[k] == v, (k,r[k],v,r)
          symbols=inv.parse_symbols(Path('/tmp/p11q-evidence/baseline-symbols.txt').read_text(errors='replace'))
          insns=inv.parse_disassembly(Path('/tmp/p11q-evidence/baseline-disassembly.txt').read_text(errors='replace'))
          assert symbols.get('apsis_space_fdn_render') == 1114, symbols.get('apsis_space_fdn_render')
          assert insns.get('apsis_space_fdn_render') == 374, insns.get('apsis_space_fdn_render')
          assert symbols.get('space_sine_point') == 48, symbols.get('space_sine_point')
          assert insns.get('space_sine_point') == 14, insns.get('space_sine_point')
          print('PASS: P11Q exact P11O target baseline regenerated')
          PY

      - name: Gate P11Q.4 - ephemeral candidate full historical behavior
        run: |
          set -euo pipefail
          python3 ci/p11q_apply_sine_endpoint_candidate.py \
            | tee "$P11Q_EVIDENCE/candidate-apply.log"
          git diff -- apsis/apsis_space_dsp.c apsis/apsis_space_dsp.h \
            > "$P11Q_EVIDENCE/candidate.patch"
          test -s "$P11Q_EVIDENCE/candidate.patch"
          cat > /tmp/p11q_size.c <<'EOF'
          #include <stdio.h>
          #include "apsis_space_dsp.h"
          int main(void) {
              printf("P11Q candidate host sizeof_line=%zu sizeof_fdn=%zu\n",
                     sizeof(ApsisSpaceFdnLine), sizeof(ApsisSpaceFdn));
              return 0;
          }
          EOF
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            /tmp/p11q_size.c -o /tmp/p11q_size
          /tmp/p11q_size | tee "$P11Q_EVIDENCE/candidate-host-size.log"
          bash ci/p11f_prepare.sh | tee "$P11Q_EVIDENCE/candidate-historical-prepare.log"
          echo 'PASS: P11Q ephemeral candidate passes full historical host + sanitizer behavior' \
            | tee -a "$P11Q_EVIDENCE/candidate-historical-prepare.log"

      - name: Gate P11Q.5 - ephemeral real-target projection
        run: |
          set -euo pipefail
          bash ci/apply_apsis_p10g.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json "$P11Q_EVIDENCE/candidate-target.json"
          cp build/SHA256SUMS "$P11Q_EVIDENCE/candidate-SHA256SUMS"
          ELF=work/apsis/build/dinghy.elf
          OBJDUMP="${JIELI_TOOLCHAIN:?}/common/bin/objdump"
          "$OBJDUMP" -t "$ELF" > "$P11Q_EVIDENCE/candidate-symbols.txt"
          "$OBJDUMP" -d "$ELF" > "$P11Q_EVIDENCE/candidate-disassembly.txt"
          python3 - <<'PY' | tee "$P11Q_EVIDENCE/projection.log"
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'ci')
          import p11_workload_inventory as inv
          base=json.load(open('/tmp/p11q-evidence/baseline-target.json'))
          cand=json.load(open('build/target_report.json'))
          assert cand['product'] == 'FM-1_972', cand
          assert cand['pool'] == base['pool'], (base,cand)
          assert cand['package_bytes'] == base['package_bytes'], (base,cand)
          assert cand['ram'] <= cand['ram_max'], cand
          assert cand['pool'] <= cand['pool_max'], cand
          bs=inv.parse_symbols(Path('/tmp/p11q-evidence/baseline-symbols.txt').read_text(errors='replace'))
          bi=inv.parse_disassembly(Path('/tmp/p11q-evidence/baseline-disassembly.txt').read_text(errors='replace'))
          cs=inv.parse_symbols(Path('/tmp/p11q-evidence/candidate-symbols.txt').read_text(errors='replace'))
          ci=inv.parse_disassembly(Path('/tmp/p11q-evidence/candidate-disassembly.txt').read_text(errors='replace'))
          report={
              'baseline': base,
              'candidate': cand,
              'delta_image': cand['image']-base['image'],
              'delta_ram': cand['ram']-base['ram'],
              'delta_pool': cand['pool']-base['pool'],
              'baseline_render_bytes': bs.get('apsis_space_fdn_render'),
              'candidate_render_bytes': cs.get('apsis_space_fdn_render'),
              'delta_render_bytes': cs.get('apsis_space_fdn_render',0)-bs.get('apsis_space_fdn_render',0),
              'baseline_render_insns': bi.get('apsis_space_fdn_render'),
              'candidate_render_insns': ci.get('apsis_space_fdn_render'),
              'delta_render_insns': ci.get('apsis_space_fdn_render',0)-bi.get('apsis_space_fdn_render',0),
              'baseline_sine_point_bytes': bs.get('space_sine_point'),
              'candidate_sine_point_bytes': cs.get('space_sine_point'),
              'baseline_sine_point_insns': bi.get('space_sine_point'),
              'candidate_sine_point_insns': ci.get('space_sine_point'),
          }
          import json as _json
          print(_json.dumps(report, sort_keys=True))
          Path('/tmp/p11q-evidence/projection.json').write_text(_json.dumps(report, indent=2, sort_keys=True)+'\n')
          print('PASS: P11Q ephemeral real-target projection captured')
          PY

      - name: Gate P11Q.6 - repo production source was never committed
        run: |
          set -euo pipefail
          test "$(git show HEAD:apsis/apsis_space_dsp.c | git hash-object --stdin)" = 'de554864167e410f69260a3d3720698b4ae456a7'
          test "$(git show HEAD:apsis/apsis_space_dsp.h | git hash-object --stdin)" = '71afae3c4c52bbd735121597dfa7ad6cea4f32f5'
          test "$(git show HEAD:apsis/apsis_space_room.c | git hash-object --stdin)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          echo 'PASS: P11Q candidate existed only in the CI workspace; repository production Space remains exact P11O'

      - name: Upload P11Q evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11q-fdn-sine-endpoint-cache-proof-evidence
          path: /tmp/p11q-evidence
          if-no-files-found: error
