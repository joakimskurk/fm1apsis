name: APSIS Phase 11T selective FDN Q15 narrow-helper proof

on:
  workflow_dispatch:

jobs:
  p11t-proof:
    runs-on: ubuntu-24.04
    env:
      P11T_EVIDENCE: /tmp/p11t-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a1907d5389de36ba094d86e2a74a6af729327651
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Python packages
        run: python3 -m pip install Pillow

      - name: Initialize proof evidence and freeze production authority
        run: |
          set -euo pipefail
          rm -rf "$P11T_EVIDENCE"
          mkdir -p "$P11T_EVIDENCE"
          test "$(git rev-parse HEAD)" = 'a1907d5389de36ba094d86e2a74a6af729327651'
          test "$(git hash-object apsis/apsis_space_dsp.c)" = 'e970aeaff9264c37188c7d3fbcad2960bad03a69'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = 'e5d93117d6bab1552532c6a7f6bd9af6758cab9f'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          git rev-parse HEAD | tee "$P11T_EVIDENCE/head.txt"
          echo 'PASS: P11T repository production Space is exact P11R before proof/projection' \
            | tee "$P11T_EVIDENCE/source-freeze.log"

      - name: Gate P11T.1 - helper boundaries/random and complete-FDN equivalence
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            tests/test_p11t_fdn_selective_q15_narrow_equivalence.c \
            -o /tmp/test_p11t_fdn_selective_q15_narrow
          /tmp/test_p11t_fdn_selective_q15_narrow | tee "$P11T_EVIDENCE/proof.log"
          grep -q 'P11T helper random_equivalence_cases=1000000 safe_dynamic_calls_per_frame=24 wide_dynamic_calls_per_frame=16' "$P11T_EVIDENCE/proof.log"
          grep -q 'P11T cold blocks=256 frames=16384' "$P11T_EVIDENCE/proof.log"
          grep -q 'P11T warm blocks=1024 frames=65536' "$P11T_EVIDENCE/proof.log"
          grep -q 'P11T legal_sweep blocks=423 frames=13536' "$P11T_EVIDENCE/proof.log"
          grep -q 'P11T random blocks=4096' "$P11T_EVIDENCE/proof.log"
          grep -q 'P11T adversarial blocks=512 frames=32768' "$P11T_EVIDENCE/proof.log"
          grep -q 'PASS: P11T selective Q15 narrow-helper candidate is bit-identical' "$P11T_EVIDENCE/proof.log"

      - name: Gate P11T.2 - sanitizer equivalence
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis \
            tests/test_p11t_fdn_selective_q15_narrow_equivalence.c \
            -o /tmp/test_p11t_fdn_selective_q15_narrow_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_p11t_fdn_selective_q15_narrow_san \
            | tee "$P11T_EVIDENCE/proof-san.log"
          grep -q 'PASS: P11T selective Q15 narrow-helper candidate is bit-identical' "$P11T_EVIDENCE/proof-san.log"

      - name: JieLi Linux toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"

      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Gate P11T.3 - regenerate exact P11R target baseline
        run: |
          set -euo pipefail
          bash ci/p11f_prepare.sh
          bash ci/apply_apsis_p10g.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json "$P11T_EVIDENCE/baseline-target.json"
          cp build/SHA256SUMS "$P11T_EVIDENCE/baseline-SHA256SUMS"
          ELF=work/apsis/build/dinghy.elf
          OBJDUMP="${JIELI_TOOLCHAIN:?}/common/bin/objdump"
          "$OBJDUMP" -t "$ELF" > "$P11T_EVIDENCE/baseline-symbols.txt"
          "$OBJDUMP" -d "$ELF" > "$P11T_EVIDENCE/baseline-disassembly.txt"
          python3 - <<'PY' | tee "$P11T_EVIDENCE/baseline-check.log"
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'ci')
          import p11_workload_inventory as inv
          r=json.load(open('build/target_report.json'))
          expected={
              'product':'FM-1_972','image':140472,'ram':87524,'pool':319176,
              'ram_headroom':10780,'pool_headroom':24888,'package_bytes':610110,
              'package_sha256':'bc1ff9cc52a5969a70bfeef3ae90b199b8aae6dfe25e54c771a3af46adbdc2f2',
          }
          for k,v in expected.items(): assert r[k] == v, (k,r[k],v,r)
          symbols=inv.parse_symbols(Path('/tmp/p11t-evidence/baseline-symbols.txt').read_text(errors='replace'))
          insns=inv.parse_disassembly(Path('/tmp/p11t-evidence/baseline-disassembly.txt').read_text(errors='replace'))
          assert symbols.get('apsis_space_fdn_render') == 1098, symbols.get('apsis_space_fdn_render')
          assert insns.get('apsis_space_fdn_render') == 366, insns.get('apsis_space_fdn_render')
          print('P11T baseline render_bytes=1098 render_static_insns=366')
          print('P11T baseline wide_mul_symbol_bytes=', symbols.get('space_mul_q15'))
          print('P11T baseline wide_mul_static_insns=', insns.get('space_mul_q15'))
          print('PASS: P11T exact P11R target baseline regenerated')
          PY

      - name: Gate P11T.4 - ephemeral candidate full historical behavior
        run: |
          set -euo pipefail
          python3 ci/p11t_apply_selective_q15_candidate.py \
            | tee "$P11T_EVIDENCE/candidate-apply.log"
          git diff -- apsis/apsis_space_dsp.c > "$P11T_EVIDENCE/candidate.patch"
          test -s "$P11T_EVIDENCE/candidate.patch"
          git diff --check
          bash ci/p11f_prepare.sh | tee "$P11T_EVIDENCE/candidate-historical-prepare.log"
          echo 'PASS: P11T ephemeral candidate passes full historical host + sanitizer behavior' \
            | tee -a "$P11T_EVIDENCE/candidate-historical-prepare.log"

      - name: Gate P11T.5 - ephemeral real-target projection
        run: |
          set -euo pipefail
          bash ci/apply_apsis_p10g.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json "$P11T_EVIDENCE/candidate-target.json"
          cp build/SHA256SUMS "$P11T_EVIDENCE/candidate-SHA256SUMS"
          ELF=work/apsis/build/dinghy.elf
          OBJDUMP="${JIELI_TOOLCHAIN:?}/common/bin/objdump"
          "$OBJDUMP" -t "$ELF" > "$P11T_EVIDENCE/candidate-symbols.txt"
          "$OBJDUMP" -d "$ELF" > "$P11T_EVIDENCE/candidate-disassembly.txt"
          python3 - <<'PY' | tee "$P11T_EVIDENCE/candidate-target-check.log"
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'ci')
          import p11_workload_inventory as inv
          base=json.load(open('/tmp/p11t-evidence/baseline-target.json'))
          cand=json.load(open('build/target_report.json'))
          assert cand['product'] == 'FM-1_972', cand
          assert cand['ram'] == base['ram'], (base,cand)
          assert cand['pool'] == base['pool'], (base,cand)
          symbols=inv.parse_symbols(Path('/tmp/p11t-evidence/candidate-symbols.txt').read_text(errors='replace'))
          insns=inv.parse_disassembly(Path('/tmp/p11t-evidence/candidate-disassembly.txt').read_text(errors='replace'))
          rb=symbols.get('apsis_space_fdn_render')
          ri=insns.get('apsis_space_fdn_render')
          print('P11T candidate target', cand)
          print('P11T target delta image=', cand['image']-base['image'],
                'ram=', cand['ram']-base['ram'], 'pool=', cand['pool']-base['pool'])
          print('P11T candidate render_bytes=', rb,
                'delta=', None if rb is None else rb-1098)
          print('P11T candidate render_static_insns=', ri,
                'delta=', None if ri is None else ri-366)
          print('P11T candidate wide_mul_symbol_bytes=', symbols.get('space_mul_q15'))
          print('P11T candidate wide_mul_static_insns=', insns.get('space_mul_q15'))
          print('P11T candidate narrow_mul_symbol_bytes=', symbols.get('space_mul_q15_i32'))
          print('P11T candidate narrow_mul_static_insns=', insns.get('space_mul_q15_i32'))
          print('PASS: P11T ephemeral real-target projection built and measured')
          PY

      - name: Gate P11T.6 - candidate never entered committed production authority
        run: |
          set -euo pipefail
          test "$(git show HEAD:apsis/apsis_space_dsp.c | git hash-object --stdin)" = 'e970aeaff9264c37188c7d3fbcad2960bad03a69'
          test "$(git show HEAD:apsis/apsis_space_dsp.h | git hash-object --stdin)" = 'e5d93117d6bab1552532c6a7f6bd9af6758cab9f'
          test "$(git show HEAD:apsis/apsis_space_room.c | git hash-object --stdin)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          test "$(git diff --name-only | sort)" = 'apsis/apsis_space_dsp.c'
          grep -q 'space_mul_q15_i32' apsis/apsis_space_dsp.c
          grep -q 'int32_t feedback = space_mul_q15(mixed\[k\], SPACE_HAD_NORM_Q15);' apsis/apsis_space_dsp.c
          grep -q 'feedback = space_mul_q15(feedback, fdn->feedback_q15\[k\]);' apsis/apsis_space_dsp.c
          echo 'PASS: P11T candidate is ephemeral; committed production remains P11R and wide veto sites remain wide'

      - name: Upload P11T evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11t-fdn-selective-q15-narrow-proof-evidence
          path: /tmp/p11t-evidence
          if-no-files-found: error
