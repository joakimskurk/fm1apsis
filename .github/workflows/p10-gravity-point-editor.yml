name: APSIS Phase 10 Gravity point editor

on:
  push:
    branches: [p10-string-motion]
  pull_request:
  workflow_dispatch:

jobs:
  p10g-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Build host contract
        run: |
          mkdir -p build/p10g
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            apsis/apsis_controls_gravity_point.c \
            tests/test_controls_gravity_point.c \
            -o build/p10g/test_controls_gravity_point

      - name: Gate P10G.1 - host selected-point contract
        run: build/p10g/test_controls_gravity_point

      - name: Build sanitizer contract
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis \
            apsis/apsis_controls_gravity_point.c \
            tests/test_controls_gravity_point.c \
            -o build/p10g/san_controls_gravity_point

      - name: Gate P10G.2 - ASAN/UBSAN selected-point contract
        run: |
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            build/p10g/san_controls_gravity_point

      - name: Gate P10G.3 - ownership and existing-grid authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c = Path('apsis/apsis_controls_gravity_point.c').read_text()
          forbidden = (
              'apsis_runtime_',
              'ApsisMotherPending',
              'random_',
              'event_queue',
          )
          for token in forbidden:
              if token in c:
                  raise SystemExit(f'FAIL: P10G editor crossed runtime/pending ownership: {token}')
          required = (
              'gravity->points[index]',
              'gravity->selected_point_degree',
              'gravity->selected_ring',
              'APSIS_FM1_ENC_K1',
              'APSIS_FM1_ENC_K2',
              'APSIS_FM1_ENC_K3',
              'APSIS_FM1_ENC_K4',
              'APSIS_FM1_ENC_SELECT',
              'APSIS_FM1_ENC_PRESETS',
          )
          for token in required:
              if token not in c:
                  raise SystemExit(f'FAIL: P10G missing existing point/control authority: {token}')
          print('PASS: P10G is a direct control layer over the existing 24-point Gravity grid')
          PY
