name: APSIS Phase 11J FDN coefficient recomputation census

on:
  workflow_dispatch:

jobs:
  p11j-census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 17030232e5f21f95a81b834e831d9021683d81bf
      - name: Generate test-only instrumented FDN source
        run: python3 ci/p11j_instrument_sources.py --out /tmp/p11j-src
      - name: Gate P11J.1 - deterministic coefficient census
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '17030232e5f21f95a81b834e831d9021683d81bf'
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iapsis -Itests \
            /tmp/p11j-src/apsis_space_dsp.c \
            apsis/apsis_space_room.c \
            tests/test_p11j_fdn_coeff_census.c \
            -o /tmp/test_p11j_fdn_coeff_census
          /tmp/test_p11j_fdn_coeff_census | tee /tmp/p11j-census.log
          grep -q 'PASS: P11J FDN coefficient recomputation census' /tmp/p11j-census.log
          grep -q 'scenario=steady renders=256 gain_calls=2048 decay_changes=0' /tmp/p11j-census.log
      - name: Gate P11J.2 - census under ASAN and UBSAN
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis -Itests \
            /tmp/p11j-src/apsis_space_dsp.c \
            apsis/apsis_space_room.c \
            tests/test_p11j_fdn_coeff_census.c \
            -o /tmp/test_p11j_fdn_coeff_census_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_p11j_fdn_coeff_census_san | tee /tmp/p11j-census-san.log
          grep -q 'PASS: P11J FDN coefficient recomputation census' /tmp/p11j-census-san.log
      - name: Gate P11J.3 - production DSP remains exact P11I source
        run: |
          set -euo pipefail
          test "$(git hash-object apsis/apsis_space_dsp.c)" = '72210e122b68bff77c56805618b2703d363a25ef'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          echo 'PASS: P11J instrumentation is test-only; P11I production Space sources are untouched'
