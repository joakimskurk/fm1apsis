name: APSIS Phase 11G workload proxy inventory

# Historical read-only workload gate. Authoritative green run 41333497987 on
# dbe0b540e602ea5ce8d93f4b119951736f5549bc. Manual reruns always check out
# that proven technical head so later optimisation cannot silently reinterpret
# the P11G baseline.
on:
  workflow_dispatch:

jobs:
  p11g-workload-inventory:
    runs-on: ubuntu-24.04
    env:
      P11G_EVIDENCE: /tmp/p11g-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: dbe0b540e602ea5ce8d93f4b119951736f5549bc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Python packages
        run: python3 -m pip install Pillow

      - name: Initialize persistent P11G evidence directory
        run: |
          rm -rf "$P11G_EVIDENCE"
          mkdir -p "$P11G_EVIDENCE"

      - name: Gate P11G.1 - frozen P11F host and sanitizer behavior
        run: bash ci/p11f_prepare.sh

      - name: JieLi Linux toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"

      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Gate P11G.2 - exact frozen P11F production target
        run: |
          set -euo pipefail
          bash ci/apply_apsis_p10g.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json "$P11G_EVIDENCE/production-target.json"
          cp build/SHA256SUMS "$P11G_EVIDENCE/production-SHA256SUMS"
          python3 - <<'PY'
          import json
          r=json.load(open('build/target_report.json'))
          expected = {
              'product': 'FM-1_972',
              'image': 140408,
              'image_max': 581564,
              'ram': 87476,
              'ram_max': 98304,
              'pool': 319176,
              'pool_max': 344064,
              'ram_headroom': 10828,
              'pool_headroom': 24888,
              'package_bytes': 610110,
              'package_sha256': 'e0d0b826f0c2d5b8f1af781a9259b5d78dce9062939661ac7acad17bfefb78e5',
          }
          for k,v in expected.items():
              assert r[k] == v, (k, r[k], v, r)
          print('PASS: P11G starts from exact frozen P11F production target')
          PY

      - name: Gate P11G.3 - deterministic target/source workload proxy inventory
        run: |
          set -euo pipefail
          E="$P11G_EVIDENCE"
          mkdir -p "$E"
          ELF=work/apsis/build/dinghy.elf
          OBJDUMP="${JIELI_TOOLCHAIN:?JIELI_TOOLCHAIN not set}/common/bin/objdump"
          test -f "$ELF"
          test -x "$OBJDUMP"

          "$OBJDUMP" -t "$ELF" > "$E/symbols.txt"
          "$OBJDUMP" -d "$ELF" > "$E/disassembly.txt"
          cp work/apsis/firmware/src/dinghy.c "$E/generated_dinghy.c"
          cp work/apsis/firmware/src/apsis_visual.h "$E/apsis_visual.h"

          python3 ci/p11_workload_inventory.py \
            --dinghy "$E/generated_dinghy.c" \
            --visual-header "$E/apsis_visual.h" \
            --symbols "$E/symbols.txt" \
            --disassembly "$E/disassembly.txt" \
            --target "$E/production-target.json" \
            --out-json "$E/workload_inventory.json" \
            --out-md "$E/workload_inventory.md" \
            | tee "$E/workload_inventory.log"
          cat "$E/workload_inventory.md"

      - name: Gate P11G.4 - exact frozen idle emulator behavior
        run: |
          set -euo pipefail
          APSIS_EMU_DYNAMIC_HOME=1 APSIS_EMU_EXPECT_CURSOR=123392 \
            bash ci/emulator_smoke.sh build/apsis-0.1-dev.fwsc 2>&1 \
            | tee "$P11G_EVIDENCE/idle.log"
          cp work/emu-smoke/report.json "$P11G_EVIDENCE/idle-report.json"
          python3 - <<'PY'
          import json
          r=json.load(open('work/emu-smoke/report.json'))
          assert r['wav_raw_sha256'] == 'c4fa18954cd5d5ecc895ec9457d673b8bdbe0f946c0d2aa3efa3d28f77c60f93', r
          assert r['runtime_cursor_low32'] == 123392, r
          assert r['runtime_queue_high_water'] == 28, r
          assert r['runtime_queue_overflowed'] == 0, r
          assert r['runtime_late_flags'] == 0, r
          assert r['runtime_late_trace_hash'] == '811c9dc5', r
          print('PASS: P11G exact frozen idle PCM/runtime')
          PY

      - name: Gate P11G.5 - combined active control/audio regression proxy
        run: |
          set -euo pipefail
          bash ci/p11f_prepare.sh
          bash ci/apply_apsis_p10d3_probe.sh
          bash ci/build_apsis_target.sh
          mkdir -p "$P11G_EVIDENCE"
          cp build/target_report.json "$P11G_EVIDENCE/active-target.json"
          cp build/SHA256SUMS "$P11G_EVIDENCE/active-SHA256SUMS"
          python3 - <<'PY'
          import json
          r=json.load(open('build/target_report.json'))
          expected = {
              'product': 'FM-1_972',
              'image': 137672,
              'ram': 87524,
              'pool': 319176,
              'package_sha256': '6dc05756b22dfbf7a825b1877207209a2cd667f8f0223fa56f5603a933ffe86c',
          }
          for k,v in expected.items():
              assert r[k] == v, (k, r[k], v, r)
          print('PASS: P11G active control/audio probe uses exact frozen P11F target')
          PY
          bash ci/emulator_motion_active.sh build/apsis-0.1-dev.fwsc 2>&1 \
            | tee "$P11G_EVIDENCE/active-motion.log"
          cp work/emu-motion-active/report.json "$P11G_EVIDENCE/active-motion-report.json"
          cp work/emu-motion-active/apsis-motion.wav "$P11G_EVIDENCE/active-motion.wav"

      - name: Upload P11G evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11g-workload-inventory-evidence
          path: /tmp/p11g-evidence
          if-no-files-found: error
