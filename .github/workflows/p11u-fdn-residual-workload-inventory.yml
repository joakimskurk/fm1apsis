name: APSIS Phase 11U residual FDN workload inventory

on:
  push:
    branches: [p11u-fdn-residual-workload-inventory-staging]
    paths:
      - tests/test_p11u_fdn_residual_inventory.c
      - ci/p11u_target_residual_inventory.py
      - .github/workflows/p11u-fdn-residual-workload-inventory.yml
  workflow_dispatch:

jobs:
  p11u-inventory:
    runs-on: ubuntu-24.04
    env:
      P11U_EVIDENCE: /tmp/p11u-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Python packages
        run: python3 -m pip install Pillow

      - name: Initialize evidence and prove production remains exact P11R
        run: |
          set -euo pipefail
          rm -rf "$P11U_EVIDENCE"
          mkdir -p "$P11U_EVIDENCE"
          test "$(git hash-object apsis/apsis_space_dsp.c)" = 'e970aeaff9264c37188c7d3fbcad2960bad03a69'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = 'e5d93117d6bab1552532c6a7f6bd9af6758cab9f'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          git rev-parse HEAD | tee "$P11U_EVIDENCE/head.txt"
          echo 'PASS: P11U is measurement-only; production Space is exact P11R' \
            | tee "$P11U_EVIDENCE/source-freeze.log"

      - name: Gate P11U.1 - residual natural workload and exhaustive sine-delta census
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            tests/test_p11u_fdn_residual_inventory.c \
            -o /tmp/test_p11u_fdn_residual_inventory
          /tmp/test_p11u_fdn_residual_inventory | tee "$P11U_EVIDENCE/residual.log"
          grep -q 'P11U cold frames=16384 sine_calls=131072 endpoint_refreshes=88 endpoint_reuses=130984 delta_recomputes=131072' "$P11U_EVIDENCE/residual.log"
          grep -q 'P11U warm frames=65536 sine_calls=524288 endpoint_refreshes=367 endpoint_reuses=523921 delta_recomputes=524288' "$P11U_EVIDENCE/residual.log"
          grep -q 'P11U combined sine_calls=655360 current_delta_subtractions=655360 dynamic_endpoint_transitions=455 delta_evals_if_cached_including_reset=463 render_delta_subtractions_avoidable=654905' "$P11U_EVIDENCE/residual.log"
          grep -q 'P11U exhaustive_sine_delta indices=256 .* fits_int16=true' "$P11U_EVIDENCE/residual.log"
          grep -q 'P11U fixed_per_room_frame line_reads=8 line_writes=8 sine_interpolations=8 sine_delta_subtractions=8 output_sign_projections=16 hadamard_addsub=24 clamp_calls=8 q15_total=40 q15_structural_safe32=24 q15_structural_wide=16' "$P11U_EVIDENCE/residual.log"
          grep -q 'PASS: P11U residual FDN workload inventory' "$P11U_EVIDENCE/residual.log"

      - name: Gate P11U.2 - sanitizer inventory
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis \
            tests/test_p11u_fdn_residual_inventory.c \
            -o /tmp/test_p11u_fdn_residual_inventory_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_p11u_fdn_residual_inventory_san \
            | tee "$P11U_EVIDENCE/residual-san.log"
          grep -q 'PASS: P11U residual FDN workload inventory' "$P11U_EVIDENCE/residual-san.log"

      - name: JieLi Linux toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"

      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Gate P11U.3 - exact P11R real-target residual code shape
        run: |
          set -euo pipefail
          bash ci/p11f_prepare.sh
          bash ci/apply_apsis_p10g.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json "$P11U_EVIDENCE/target-report.json"
          cp build/SHA256SUMS "$P11U_EVIDENCE/SHA256SUMS"
          ELF=work/apsis/build/dinghy.elf
          OBJDUMP="${JIELI_TOOLCHAIN:?}/common/bin/objdump"
          "$OBJDUMP" -t "$ELF" > "$P11U_EVIDENCE/symbols.txt"
          "$OBJDUMP" -d "$ELF" > "$P11U_EVIDENCE/disassembly.txt"
          python3 - <<'PY'
          import json
          r=json.load(open('build/target_report.json'))
          expected={
              'product':'FM-1_972','image':140472,'ram':87524,'pool':319176,
              'ram_headroom':10780,'pool_headroom':24888,'package_bytes':610110,
              'package_sha256':'bc1ff9cc52a5969a70bfeef3ae90b199b8aae6dfe25e54c771a3af46adbdc2f2',
          }
          for k,v in expected.items(): assert r[k] == v, (k,r[k],v,r)
          print('PASS: P11U exact P11R package regenerated', r)
          PY
          python3 ci/p11u_target_residual_inventory.py \
            "$P11U_EVIDENCE/symbols.txt" \
            "$P11U_EVIDENCE/disassembly.txt" \
            "$P11U_EVIDENCE/target-report.json" \
            "$P11U_EVIDENCE/target-residual.json" \
            | tee "$P11U_EVIDENCE/target-residual.log"
          grep -q 'PASS: P11U exact P11R residual target code-shape inventory' "$P11U_EVIDENCE/target-residual.log"

      - name: Gate P11U.4 - production source remained untouched
        run: |
          set -euo pipefail
          test "$(git hash-object apsis/apsis_space_dsp.c)" = 'e970aeaff9264c37188c7d3fbcad2960bad03a69'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = 'e5d93117d6bab1552532c6a7f6bd9af6758cab9f'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          git diff --check
          echo 'PASS: P11U committed production Space remains exact P11R'

      - name: Upload P11U evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11u-fdn-residual-workload-inventory-evidence
          path: /tmp/p11u-evidence
          if-no-files-found: error
