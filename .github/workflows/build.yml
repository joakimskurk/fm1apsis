name: APSIS FM-1 release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: bash ci/build_target.sh
      packages: build/apsis-*.fwsc
      sdk: true
