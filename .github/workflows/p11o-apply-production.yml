name: APSIS Phase 11O one-shot production line-read patch

on:
  push:
    branches:
      - p11o-fdn-line-read-production-staging
    paths:
      - .github/workflows/p11o-apply-production.yml

permissions:
  contents: write

jobs:
  apply-production:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Apply exact P11N-proved production change
        run: |
          set -euo pipefail
          test "$(git hash-object apsis/apsis_space_dsp.c)" = '0c472f3844210f0dfb3d31bf6dacf007272ac078'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = '71afae3c4c52bbd735121597dfa7ad6cea4f32f5'
          python3 ci/p11o_apply_production_line_read.py
          git diff --check
          git diff -- apsis/apsis_space_dsp.c
      - name: Commit production patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apsis/apsis_space_dsp.c
          git commit -m 'phase11o: apply proved FDN line-read simplification'
          git push origin HEAD:p11o-fdn-line-read-production-staging
