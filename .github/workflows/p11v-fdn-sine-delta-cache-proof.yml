name: APSIS Phase 11V FDN sine A+delta cache proof

on:
  push:
    branches: [p11v-fdn-sine-delta-cache-proof-staging]
    paths:
      - tests/test_p11v_fdn_sine_delta_cache_equivalence.c
      - ci/p11v_apply_sine_delta_candidate.py
      - .github/workflows/p11v-fdn-sine-delta-cache-proof.yml
  workflow_dispatch:

jobs:
  p11v-proof:
    runs-on: ubuntu-24.04
    env:
      P11V_EVIDENCE: /tmp/p11v-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Python packages
        run: python3 -m pip install Pillow

      - name: Initialize proof evidence and freeze P11R production authority
        run: |
          set -euo pipefail
          rm -rf "$P11V_EVIDENCE"
          mkdir -p "$P11V_EVIDENCE"
          test "$(git hash-object apsis/apsis_space_dsp.c)" = 'e970aeaff9264c37188c7d3fbcad2960bad03a69'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = 'e5d93117d6bab1552532c6a7f6bd9af6758cab9f'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          git rev-parse HEAD | tee "$P11V_EVIDENCE/head.txt"
          echo 'PASS: P11V committed production Space is exact P11R before proof/projection' \
            | tee "$P11V_EVIDENCE/source-freeze.log"

      - name: Gate P11V.1 - complete phase/transition and full-FDN equivalence
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            tests/test_p11v_fdn_sine_delta_cache_equivalence.c \
            -o /tmp/test_p11v_fdn_sine_delta_cache
          /tmp/test_p11v_fdn_sine_delta_cache | tee "$P11V_EVIDENCE/proof.log"
          grep -q 'P11V top16 interpolation_equivalence_cases=65536' "$P11V_EVIDENCE/proof.log"
          grep -q 'P11V index_transition_cases=65536 refreshes=65280 reuses=256 incl_255_to_0=true' "$P11V_EVIDENCE/proof.log"
          grep -q 'P11V cold blocks=256 frames=16384' "$P11V_EVIDENCE/proof.log"
          grep -q 'P11V warm blocks=1024 frames=65536' "$P11V_EVIDENCE/proof.log"
          grep -q 'P11V legal_sweep blocks=423 frames=13536' "$P11V_EVIDENCE/proof.log"
          grep -q 'P11V random blocks=4096' "$P11V_EVIDENCE/proof.log"
          grep -q 'P11V adversarial blocks=512 frames=32768' "$P11V_EVIDENCE/proof.log"
          grep -q 'sizeof_line=28 sizeof_fdn=264' "$P11V_EVIDENCE/proof.log"
          grep -q 'PASS: P11V cached sine A+delta candidate is bit-identical' "$P11V_EVIDENCE/proof.log"

      - name: Gate P11V.2 - sanitizer equivalence
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis \
            tests/test_p11v_fdn_sine_delta_cache_equivalence.c \
            -o /tmp/test_p11v_fdn_sine_delta_cache_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_p11v_fdn_sine_delta_cache_san \
            | tee "$P11V_EVIDENCE/proof-san.log"
          grep -q 'PASS: P11V cached sine A+delta candidate is bit-identical' "$P11V_EVIDENCE/proof-san.log"

      - name: JieLi Linux toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"

      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Gate P11V.3 - regenerate exact P11R target baseline
        run: |
          set -euo pipefail
          bash ci/p11f_prepare.sh
          bash ci/apply_apsis_p10g.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json "$P11V_EVIDENCE/baseline-target.json"
          cp build/SHA256SUMS "$P11V_EVIDENCE/baseline-SHA256SUMS"
          ELF=work/apsis/build/dinghy.elf
          OBJDUMP="${JIELI_TOOLCHAIN:?}/common/bin/objdump"
          "$OBJDUMP" -t "$ELF" > "$P11V_EVIDENCE/baseline-symbols.txt"
          "$OBJDUMP" -d "$ELF" > "$P11V_EVIDENCE/baseline-disassembly.txt"
          python3 - <<'PY' | tee "$P11V_EVIDENCE/baseline-check.log"
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'ci')
          import p11_workload_inventory as inv
          r=json.load(open('build/target_report.json'))
          expected={
              'product':'FM-1_972','image':140472,'ram':87524,'pool':319176,
              'ram_headroom':10780,'pool_headroom':24888,'package_bytes':610110,
              'package_sha256':'bc1ff9cc52a5969a70bfeef3ae90b199b8aae6dfe25e54c771a3af46adbdc2f2',
          }
          for k,v in expected.items(): assert r[k] == v, (k,r[k],v,r)
          symbols=inv.parse_symbols(Path('/tmp/p11v-evidence/baseline-symbols.txt').read_text(errors='replace'))
          insns=inv.parse_disassembly(Path('/tmp/p11v-evidence/baseline-disassembly.txt').read_text(errors='replace'))
          assert symbols.get('apsis_space_fdn_render') == 1098, symbols.get('apsis_space_fdn_render')
          assert insns.get('apsis_space_fdn_render') == 366, insns.get('apsis_space_fdn_render')
          print('P11V baseline render_bytes=1098 render_static_insns=366')
          print('PASS: P11V exact P11R target baseline regenerated')
          PY

      - name: Gate P11V.4 - ephemeral candidate full historical behavior and state size
        run: |
          set -euo pipefail
          python3 ci/p11v_apply_sine_delta_candidate.py \
            | tee "$P11V_EVIDENCE/candidate-apply.log"
          git diff -- apsis/apsis_space_dsp.c apsis/apsis_space_dsp.h \
            > "$P11V_EVIDENCE/candidate.patch"
          test -s "$P11V_EVIDENCE/candidate.patch"
          git diff --check
          cat > /tmp/p11v_size.c <<'EOF'
          #include <stdio.h>
          #include "apsis_space_dsp.h"
          int main(void) {
              printf("P11V candidate sizeof_line=%zu sizeof_fdn=%zu\n",
                     sizeof(ApsisSpaceFdnLine), sizeof(ApsisSpaceFdn));
              return 0;
          }
          EOF
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            /tmp/p11v_size.c -o /tmp/p11v_size
          /tmp/p11v_size | tee "$P11V_EVIDENCE/candidate-host-size.log"
          grep -q 'P11V candidate sizeof_line=28 sizeof_fdn=264' "$P11V_EVIDENCE/candidate-host-size.log"
          bash ci/p11f_prepare.sh | tee "$P11V_EVIDENCE/candidate-historical-prepare.log"
          echo 'PASS: P11V ephemeral candidate passes full historical host + sanitizer behavior' \
            | tee -a "$P11V_EVIDENCE/candidate-historical-prepare.log"

      - name: Gate P11V.5 - ephemeral real-target projection
        run: |
          set -euo pipefail
          bash ci/apply_apsis_p10g.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json "$P11V_EVIDENCE/candidate-target.json"
          cp build/SHA256SUMS "$P11V_EVIDENCE/candidate-SHA256SUMS"
          ELF=work/apsis/build/dinghy.elf
          OBJDUMP="${JIELI_TOOLCHAIN:?}/common/bin/objdump"
          "$OBJDUMP" -t "$ELF" > "$P11V_EVIDENCE/candidate-symbols.txt"
          "$OBJDUMP" -d "$ELF" > "$P11V_EVIDENCE/candidate-disassembly.txt"
          python3 - <<'PY' | tee "$P11V_EVIDENCE/candidate-target-check.log"
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'ci')
          import p11_workload_inventory as inv
          base=json.load(open('/tmp/p11v-evidence/baseline-target.json'))
          cand=json.load(open('build/target_report.json'))
          assert cand['product'] == 'FM-1_972', cand
          assert cand['ram'] == base['ram'], (base,cand)
          assert cand['pool'] == base['pool'], (base,cand)
          symbols=inv.parse_symbols(Path('/tmp/p11v-evidence/candidate-symbols.txt').read_text(errors='replace'))
          insns=inv.parse_disassembly(Path('/tmp/p11v-evidence/candidate-disassembly.txt').read_text(errors='replace'))
          rb=symbols.get('apsis_space_fdn_render')
          ri=insns.get('apsis_space_fdn_render')
          print('P11V candidate target', cand)
          print('P11V target delta image=', cand['image']-base['image'],
                'ram=', cand['ram']-base['ram'], 'pool=', cand['pool']-base['pool'])
          print('P11V candidate render_bytes=', rb,
                'delta=', None if rb is None else rb-1098)
          print('P11V candidate render_static_insns=', ri,
                'delta=', None if ri is None else ri-366)
          print('P11V space_sine_point_symbol_bytes=', symbols.get('space_sine_point'))
          print('P11V space_sine_point_static_insns=', insns.get('space_sine_point'))
          print('PASS: P11V ephemeral real-target projection built and measured')
          PY

      - name: Gate P11V.6 - candidate never entered committed production authority
        run: |
          set -euo pipefail
          test "$(git show HEAD:apsis/apsis_space_dsp.c | git hash-object --stdin)" = 'e970aeaff9264c37188c7d3fbcad2960bad03a69'
          test "$(git show HEAD:apsis/apsis_space_dsp.h | git hash-object --stdin)" = 'e5d93117d6bab1552532c6a7f6bd9af6758cab9f'
          test "$(git show HEAD:apsis/apsis_space_room.c | git hash-object --stdin)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          test "$(git diff --name-only | sort)" = $'apsis/apsis_space_dsp.c\napsis/apsis_space_dsp.h'
          grep -q 'lfo_sine_delta_q15' apsis/apsis_space_dsp.h
          ! grep -q 'lfo_sine_b_q15' apsis/apsis_space_dsp.h
          echo 'PASS: P11V candidate is ephemeral; committed production remains exact P11R'

      - name: Upload P11V evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11v-fdn-sine-delta-cache-proof-evidence
          path: /tmp/p11v-evidence
          if-no-files-found: error
