name: APSIS Phase 11W one-shot production patch

on:
  push:
    branches:
      - p11w-fdn-sine-delta-production-staging
    paths:
      - .github/workflows/p11w-apply-production.yml

permissions:
  contents: write

jobs:
  apply-production:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Verify frozen P11R production authority
        run: |
          set -euo pipefail
          test "$(git hash-object apsis/apsis_space_dsp.c)" = 'e970aeaff9264c37188c7d3fbcad2960bad03a69'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = 'e5d93117d6bab1552532c6a7f6bd9af6758cab9f'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
      - name: Apply exact P11V A+delta candidate
        run: |
          set -euo pipefail
          python3 ci/p11v_apply_sine_delta_candidate.py
          git diff --check
          test "$(git diff --name-only | sort)" = $'apsis/apsis_space_dsp.c\napsis/apsis_space_dsp.h'
          grep -q 'lfo_sine_delta_q15' apsis/apsis_space_dsp.h
          ! grep -q 'lfo_sine_b_q15' apsis/apsis_space_dsp.h
      - name: Commit proved production patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apsis/apsis_space_dsp.c apsis/apsis_space_dsp.h
          git commit -m 'phase11w: apply proved FDN sine A+delta cache'
          git push origin HEAD:p11w-fdn-sine-delta-production-staging
