name: APSIS Phase 11I frozen production-patch verifier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ab6960ad3acf78dbc9f366d2a5e9358b42011cca
          fetch-depth: 1
      - name: Verify exact-anchor P11I patch is already applied
        run: |
          set -euo pipefail
          python3 ci/p11i_apply_stereo_pair.py
          python3 ci/p11i_patch_p6_adapter.py
          git diff --exit-code -- apsis/apsis_space_room.c ci/apply_apsis_p6.sh
          echo 'PASS: frozen P11I technical head already contains the authorized production and target-adapter patches'
