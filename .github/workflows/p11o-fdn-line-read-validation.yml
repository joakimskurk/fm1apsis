name: APSIS Phase 11O production FDN line-read validation

on:
  workflow_dispatch:

jobs:
  p11o-production:
    runs-on: ubuntu-24.04
    env:
      P11O_EVIDENCE: /tmp/p11o-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 6560118c1cf7dfa6e40d1e33e86167d4f0b6ea5b
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Python packages
        run: python3 -m pip install Pillow
      - name: Initialize evidence
        run: |
          rm -rf "$P11O_EVIDENCE"
          mkdir -p "$P11O_EVIDENCE"

      - name: Gate P11O.1 - actual production reader equals frozen P11L authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '6560118c1cf7dfa6e40d1e33e86167d4f0b6ea5b'
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            tests/test_p11o_fdn_line_read_production_equivalence.c \
            -o /tmp/test_p11o_fdn_line_read
          /tmp/test_p11o_fdn_line_read | tee "$P11O_EVIDENCE/production-equivalence.log"
          grep -q 'P11O helper_cases=905504 full_render_blocks=3328 full_render_frames=210677' "$P11O_EVIDENCE/production-equivalence.log"
          grep -q 'PASS: P11O production line read is bit-identical to frozen P11L authority' "$P11O_EVIDENCE/production-equivalence.log"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis \
            tests/test_p11o_fdn_line_read_production_equivalence.c \
            -o /tmp/test_p11o_fdn_line_read_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_p11o_fdn_line_read_san | tee "$P11O_EVIDENCE/production-equivalence-san.log"
          grep -q 'P11O helper_cases=905504 full_render_blocks=3328 full_render_frames=210677' "$P11O_EVIDENCE/production-equivalence-san.log"
          grep -q 'PASS: P11O production line read is bit-identical to frozen P11L authority' "$P11O_EVIDENCE/production-equivalence-san.log"

      - name: Gate P11O.2 - complete frozen historical host and sanitizer behavior
        run: bash ci/p11f_prepare.sh

      - name: JieLi Linux toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"

      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Gate P11O.3 - exact real target matches P11N projection
        run: |
          set -euo pipefail
          bash ci/apply_apsis_p10g.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json "$P11O_EVIDENCE/production-target.json"
          cp build/SHA256SUMS "$P11O_EVIDENCE/production-SHA256SUMS"
          ELF=work/apsis/build/dinghy.elf
          OBJDUMP="${JIELI_TOOLCHAIN:?}/common/bin/objdump"
          "$OBJDUMP" -t "$ELF" > "$P11O_EVIDENCE/production-symbols.txt"
          "$OBJDUMP" -d "$ELF" > "$P11O_EVIDENCE/production-disassembly.txt"
          python3 - <<'PY' | tee "$P11O_EVIDENCE/production-target-check.log"
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'ci')
          import p11_workload_inventory as inv
          r=json.load(open('build/target_report.json'))
          expected={
              'product':'FM-1_972','image':140440,'ram':87492,'pool':319176,
              'ram_headroom':10812,'pool_headroom':24888,'package_bytes':610110,
              'package_sha256':'0a3c1ecc8adf99a625979e1a5369c3cad1f4a87264a227a7feefba3388da98a2',
          }
          for k,v in expected.items(): assert r[k] == v, (k,r[k],v,r)
          symbols=inv.parse_symbols(Path('/tmp/p11o-evidence/production-symbols.txt').read_text(errors='replace'))
          insns=inv.parse_disassembly(Path('/tmp/p11o-evidence/production-disassembly.txt').read_text(errors='replace'))
          assert symbols.get('apsis_space_fdn_render') == 1114, symbols.get('apsis_space_fdn_render')
          assert insns.get('apsis_space_fdn_render') == 374, insns.get('apsis_space_fdn_render')
          print('PASS: P11O actual target exactly matches P11N proved projection', r)
          PY

      - name: Gate P11O.4 - exact frozen idle emulator behavior
        run: |
          set -euo pipefail
          APSIS_EMU_DYNAMIC_HOME=1 APSIS_EMU_EXPECT_CURSOR=123392 \
            bash ci/emulator_smoke.sh build/apsis-0.1-dev.fwsc 2>&1 \
            | tee "$P11O_EVIDENCE/idle.log"
          cp work/emu-smoke/report.json "$P11O_EVIDENCE/idle-report.json"
          python3 - <<'PY'
          import json
          r=json.load(open('work/emu-smoke/report.json'))
          assert r['wav_raw_sha256'] == 'c4fa18954cd5d5ecc895ec9457d673b8bdbe0f946c0d2aa3efa3d28f77c60f93', r
          assert r['runtime_cursor_low32'] == 123392, r
          assert r['runtime_queue_high_water'] == 28, r
          assert r['runtime_queue_overflowed'] == 0, r
          assert r['runtime_late_flags'] == 0, r
          assert r['runtime_late_trace_hash'] == '811c9dc5', r
          print('PASS: P11O exact frozen idle PCM/runtime')
          PY

      - name: Gate P11O.5 - exact frozen active Motion lifecycle
        run: |
          set -euo pipefail
          bash ci/p11f_prepare.sh
          bash ci/apply_apsis_p10d3_probe.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json "$P11O_EVIDENCE/active-target.json"
          cp build/SHA256SUMS "$P11O_EVIDENCE/active-SHA256SUMS"
          python3 - <<'PY' | tee "$P11O_EVIDENCE/active-target-check.log"
          import json
          r=json.load(open('build/target_report.json'))
          expected={
              'product':'FM-1_972','image':137704,'ram':87540,'pool':319176,
              'ram_headroom':10764,'pool_headroom':24888,'package_bytes':610110,
              'package_sha256':'adb581ff61ab1dc48c7bd08f7ca83bfa33f786fb635c31f36813f40d964b54ed',
          }
          for k,v in expected.items(): assert r[k] == v, (k,r[k],v,r)
          print('PASS: P11O exact frozen active target', r)
          PY
          bash ci/emulator_motion_active.sh build/apsis-0.1-dev.fwsc 2>&1 \
            | tee "$P11O_EVIDENCE/active-motion.log"
          cp work/emu-motion-active/report.json "$P11O_EVIDENCE/active-motion-report.json"
          cp work/emu-motion-active/apsis-motion.wav "$P11O_EVIDENCE/active-motion.wav"

      - name: Gate P11O.6 - production diff stays narrow
        run: |
          set -euo pipefail
          git diff --check
          test "$(git hash-object apsis/apsis_space_dsp.c)" = 'de554864167e410f69260a3d3720698b4ae456a7'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = '71afae3c4c52bbd735121597dfa7ad6cea4f32f5'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          grep -q 'if (line->fill_count < line->capacity)' apsis/apsis_space_dsp.c
          ! grep -q 'if (delay_q8 < 256) delay_q8 = 256;' apsis/apsis_space_dsp.c
          ! grep -q 'if (read_q8 >= span_q8) read_q8 -= span_q8;' apsis/apsis_space_dsp.c
          echo 'PASS: P11O changes only the proved line-read production path'

      - name: Upload P11O evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11o-fdn-line-read-evidence
          path: /tmp/p11o-evidence
          if-no-files-found: error
