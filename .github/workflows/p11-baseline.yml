name: APSIS Phase 11A baseline inventory

# Historical measurement gate. The authoritative green baseline is run
# 41307570193 on commit 5e9eb2348ec3bd075eecfff2cad63fcca90a32a8.
# It intentionally asserts the pre-optimisation Phase-10 resource sizes and is
# therefore manual-only after P11A closes. Manual reruns check out that exact
# commit so later optimisations cannot rewrite the evidence boundary.
on:
  workflow_dispatch:

jobs:
  p11a-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 5e9eb2348ec3bd075eecfff2cad63fcca90a32a8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Python packages
        run: python3 -m pip install Pillow
      - name: JieLi Linux toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"
      - name: Gate P11A.1 - pinned upstream and historical regressions
        run: bash ci/prepare_dinghy.sh
      - name: Gate P11A.2 - host layout and Motion ownership inventory
        run: |
          mkdir -p build/evidence
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            tests/test_p11_baseline_sizes.c \
            -o /tmp/test_p11_baseline_sizes
          /tmp/test_p11_baseline_sizes | tee build/evidence/p11_sizes.json
      - name: Gate P11A.3 - regenerate merged Phase-10 production stack
        run: bash ci/apply_apsis_p10g.sh
      - name: Gate P11A.4 - real JieLi resource baseline
        run: |
          bash ci/build_apsis_target.sh
          cp build/target_report.json build/evidence/p11_target_report.json
          cp build/SHA256SUMS build/evidence/p11_SHA256SUMS
      - name: Gate P11A.5 - exact frozen inactive emulator baseline
        run: |
          set -euo pipefail
          APSIS_EMU_DYNAMIC_HOME=1 \
          APSIS_EMU_EXPECT_CURSOR=123392 \
            bash ci/emulator_smoke.sh build/apsis-0.1-dev.fwsc 2>&1 \
            | tee build/evidence/p11_emulator_idle.txt
          cp work/emu-smoke/report.json build/evidence/p11_emulator_report.json
      - name: Gate P11A.6 - consolidate measured vs unmeasured budget
        run: |
          python3 ci/p11_baseline_report.py \
            --target build/target_report.json \
            --emulator work/emu-smoke/report.json \
            --sizes build/evidence/p11_sizes.json \
            --out-json build/evidence/p11_baseline.json \
            --out-md build/evidence/p11_baseline.md
          cat build/evidence/p11_baseline.md
      - name: Upload Phase 11A baseline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11a-baseline-evidence
          path: build/evidence
          if-no-files-found: warn
