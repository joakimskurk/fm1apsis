name: APSIS Phase 11X FDN output sign-mix census

on:
  push:
    branches: [p11x-fdn-output-signmix-census-staging]
  workflow_dispatch:

jobs:
  p11x-census:
    runs-on: ubuntu-24.04
    env:
      P11X_EVIDENCE: /tmp/p11x-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Initialize evidence
        run: |
          rm -rf "$P11X_EVIDENCE"
          mkdir -p "$P11X_EVIDENCE"

      - name: Gate P11X.1 - structural and dynamic source census
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            tests/test_p11x_fdn_output_signmix_census.c \
            -o /tmp/test_p11x_signmix
          /tmp/test_p11x_signmix | tee "$P11X_EVIDENCE/signmix-census.log"
          grep -q 'left_pos=5 left_neg=3 right_pos=5 right_neg=3' "$P11X_EVIDENCE/signmix-census.log"
          grep -q 'eight_term_sum_abs_max=262136' "$P11X_EVIDENCE/signmix-census.log"
          grep -q 'scenario=cold frames=16384 sign_products=262144' "$P11X_EVIDENCE/signmix-census.log"
          grep -q 'scenario=warm frames=65536 sign_products=1048576' "$P11X_EVIDENCE/signmix-census.log"
          grep -q 'PASS: P11X FDN output sign-mix workload' "$P11X_EVIDENCE/signmix-census.log"

      - name: Gate P11X.2 - census under ASAN/UBSAN
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis \
            tests/test_p11x_fdn_output_signmix_census.c \
            -o /tmp/test_p11x_signmix_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_p11x_signmix_san | tee "$P11X_EVIDENCE/signmix-census-san.log"
          grep -q 'PASS: P11X FDN output sign-mix workload' "$P11X_EVIDENCE/signmix-census-san.log"

      - name: JieLi Linux toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"

      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Gate P11X.3 - exact P11W target and render opcode inventory
        run: |
          set -euo pipefail
          bash ci/p11f_prepare.sh
          bash ci/apply_apsis_p10g.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json "$P11X_EVIDENCE/production-target.json"
          cp build/SHA256SUMS "$P11X_EVIDENCE/production-SHA256SUMS"
          python3 - <<'PY'
          import json
          r=json.load(open('build/target_report.json'))
          expected={
              'product':'FM-1_972','image':140472,'ram':87524,'pool':319176,
              'ram_headroom':10780,'pool_headroom':24888,'package_bytes':610110,
              'package_sha256':'f9ca07eaee94843dcfa94ee7d05cdfade412ef221a1a8984243454a095ee3168',
          }
          for k,v in expected.items(): assert r[k] == v, (k,r[k],v,r)
          print('PASS: exact P11W target regenerated')
          PY
          ELF=work/apsis/build/dinghy.elf
          OBJDUMP="${JIELI_TOOLCHAIN:?}/common/bin/objdump"
          "$OBJDUMP" -d "$ELF" > "$P11X_EVIDENCE/disassembly.txt"
          python3 ci/p11x_render_opcode_inventory.py \
            --disassembly "$P11X_EVIDENCE/disassembly.txt" \
            --out-json "$P11X_EVIDENCE/render-opcodes.json" \
            --out-text "$P11X_EVIDENCE/render-disassembly.txt" \
            | tee "$P11X_EVIDENCE/render-opcodes.log"
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/p11x-evidence/render-opcodes.json'))
          assert r['instruction_lines'] == 364, r
          assert r['parsed_opcode_lines'] >= 350, r
          print('PASS: P11X opcode census covers frozen P11W render', r['multiply_like_opcodes'])
          PY

      - name: Gate P11X.4 - production Space remains exact P11W
        run: |
          set -euo pipefail
          test "$(git hash-object apsis/apsis_space_dsp.c)" = '3bcd294dd9fb610df888ddd0517da7de3bf4c086'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = 'ec221e22aeb6670ec628cbb0cc7c7eea91038554'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          echo 'PASS: P11X is measurement-only; committed Space remains exact P11W'

      - name: Upload P11X evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11x-fdn-output-signmix-evidence
          path: /tmp/p11x-evidence
          if-no-files-found: error
