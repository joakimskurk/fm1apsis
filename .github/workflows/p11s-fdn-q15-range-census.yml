name: APSIS Phase 11S FDN Q15 operand-range census

on:
  workflow_dispatch:

jobs:
  p11s-census:
    runs-on: ubuntu-24.04
    env:
      P11S_EVIDENCE: /tmp/p11s-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6ddfa625b371d9a93db3d0a5a635b48b7eb08046
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Python packages
        run: python3 -m pip install Pillow
      - name: Initialize evidence and prove production is frozen P11R
        run: |
          set -euo pipefail
          rm -rf "$P11S_EVIDENCE"
          mkdir -p "$P11S_EVIDENCE"
          test "$(git rev-parse HEAD)" = '6ddfa625b371d9a93db3d0a5a635b48b7eb08046'
          test "$(git hash-object apsis/apsis_space_dsp.c)" = 'e970aeaff9264c37188c7d3fbcad2960bad03a69'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = 'e5d93117d6bab1552532c6a7f6bd9af6758cab9f'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          git rev-parse HEAD | tee "$P11S_EVIDENCE/head.txt"
          echo 'PASS: P11S is measurement-only; production Space blobs are exact P11R' \
            | tee "$P11S_EVIDENCE/source-freeze.log"

      - name: Generate test-only instrumented Space source
        run: |
          set -euo pipefail
          python3 ci/p11s_make_instrumented_space.py \
            | tee "$P11S_EVIDENCE/instrumentation.log"
          test -s /tmp/p11s_apsis_space_dsp.c
          test "$(git hash-object apsis/apsis_space_dsp.c)" = 'e970aeaff9264c37188c7d3fbcad2960bad03a69'

      - name: Gate P11S.1 - optimized natural/sweep/random census and structural classification
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            /tmp/p11s_apsis_space_dsp.c tests/test_p11s_fdn_q15_range_census.c \
            -o /tmp/test_p11s_fdn_q15_range_census
          /tmp/test_p11s_fdn_q15_range_census | tee "$P11S_EVIDENCE/census.log"
          grep -q 'P11S cold frames=16384 total_calls=655360' "$P11S_EVIDENCE/census.log"
          grep -q 'P11S warm frames=65536 total_calls=2621440' "$P11S_EVIDENCE/census.log"
          grep -q 'P11S structural safe_dynamic_calls_per_frame=24 unsafe_dynamic_calls_per_frame=16' "$P11S_EVIDENCE/census.log"
          grep -q 'P11S structural had_norm .* safe_i32=false' "$P11S_EVIDENCE/census.log"
          grep -q 'P11S structural feedback .* safe_i32=false' "$P11S_EVIDENCE/census.log"
          grep -q 'PASS: P11S FDN Q15 operand/product census and structural-width classification' "$P11S_EVIDENCE/census.log"

      - name: Gate P11S.2 - sanitizer census
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis \
            /tmp/p11s_apsis_space_dsp.c tests/test_p11s_fdn_q15_range_census.c \
            -o /tmp/test_p11s_fdn_q15_range_census_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_p11s_fdn_q15_range_census_san \
            | tee "$P11S_EVIDENCE/census-san.log"
          grep -q 'PASS: P11S FDN Q15 operand/product census and structural-width classification' "$P11S_EVIDENCE/census-san.log"

      - name: JieLi Linux toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"

      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Gate P11S.3 - exact frozen P11R target/package and code shape
        run: |
          set -euo pipefail
          bash ci/p11f_prepare.sh
          bash ci/apply_apsis_p10g.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json "$P11S_EVIDENCE/target-report.json"
          cp build/SHA256SUMS "$P11S_EVIDENCE/SHA256SUMS"
          ELF=work/apsis/build/dinghy.elf
          OBJDUMP="${JIELI_TOOLCHAIN:?}/common/bin/objdump"
          "$OBJDUMP" -t "$ELF" > "$P11S_EVIDENCE/symbols.txt"
          "$OBJDUMP" -d "$ELF" > "$P11S_EVIDENCE/disassembly.txt"
          python3 - <<'PY' | tee "$P11S_EVIDENCE/target-check.log"
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'ci')
          import p11_workload_inventory as inv
          r=json.load(open('build/target_report.json'))
          expected={
              'product':'FM-1_972','image':140472,'ram':87524,'pool':319176,
              'ram_headroom':10780,'pool_headroom':24888,'package_bytes':610110,
              'package_sha256':'bc1ff9cc52a5969a70bfeef3ae90b199b8aae6dfe25e54c771a3af46adbdc2f2',
          }
          for k,v in expected.items(): assert r[k] == v, (k,r[k],v,r)
          symbols=inv.parse_symbols(Path('/tmp/p11s-evidence/symbols.txt').read_text(errors='replace'))
          insns=inv.parse_disassembly(Path('/tmp/p11s-evidence/disassembly.txt').read_text(errors='replace'))
          assert symbols.get('apsis_space_fdn_render') == 1098, symbols.get('apsis_space_fdn_render')
          assert insns.get('apsis_space_fdn_render') == 366, insns.get('apsis_space_fdn_render')
          print('PASS: P11S frozen P11R target/package and render code shape', r)
          PY

      - name: Gate P11S.4 - repo production source remained untouched
        run: |
          set -euo pipefail
          test "$(git hash-object apsis/apsis_space_dsp.c)" = 'e970aeaff9264c37188c7d3fbcad2960bad03a69'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = 'e5d93117d6bab1552532c6a7f6bd9af6758cab9f'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          git diff --check
          echo 'PASS: P11S committed production Space remains exact P11R'

      - name: Upload P11S evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11s-fdn-q15-range-census-evidence
          path: /tmp/p11s-evidence
          if-no-files-found: error
