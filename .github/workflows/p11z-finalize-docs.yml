name: APSIS Phase 11Z one-shot documentation finalizer

on:
  push:
    branches:
      - p11-optimization
    paths:
      - .github/workflows/p11z-finalize-docs.yml

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Freeze Phase 11 closure documentation
        run: python3 ci/p11z_finalize_docs.py
      - name: Validate documentation diff
        run: |
          git diff --check
          git diff -- ROADMAP.md PROJECT_STATE.md docs/PHASE11_FINAL_CHECKPOINT.md
      - name: Commit frozen documentation state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md PROJECT_STATE.md docs/PHASE11_FINAL_CHECKPOINT.md
          git commit -m 'phase11z: freeze Phase 11 closure and Phase 12 handoff'
          git push origin HEAD:p11-optimization
