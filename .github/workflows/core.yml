name: APSIS core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source-derived core regression
        run: make test
      - name: ASAN/UBSAN
        run: make sanitize
      - name: M4f Spiral acoustic planning
        run: bash ci/test_spiral_audio_plan.sh
      - name: M4f Spiral shared-runtime bridge
        run: bash ci/test_spiral_audio_runtime.sh
      - name: M4f Spiral finite renderer and capacity probe
        run: bash ci/test_spiral_dsp.sh
      - name: M4g Bloom occurrence acoustic planning
        run: bash ci/test_bloom_audio_plan.sh
