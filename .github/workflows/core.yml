name: APSIS core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source-derived core regression
        run: make test
      - name: ASAN/UBSAN
        run: make sanitize
      - name: M4f Spiral acoustic planning
        run: bash ci/test_spiral_audio_plan.sh
      - name: M4f Spiral shared-runtime bridge
        run: bash ci/test_spiral_audio_runtime.sh
      - name: M4f Spiral finite renderer and capacity probe
        run: bash ci/test_spiral_dsp.sh
      - name: M4g Bloom occurrence acoustic planning
        run: bash ci/test_bloom_audio_plan.sh
      - name: M4g Bloom snapshot and bind bridge
        run: bash ci/test_bloom_audio_runtime.sh
      - name: M4g Bloom shared-runtime handoff
        run: bash ci/test_bloom_audio_live.sh
      - name: M4g Bloom finite renderer and capacity probe
        run: bash ci/test_bloom_dsp.sh
      - name: P5a sounding late-binding integration
        run: bash ci/test_phase5_late_binding_audio.sh
      - name: P5b quantized Gravity sounding semantics
        run: bash ci/test_phase5_quantized_gravity_audio.sh
      - name: P5c Mother sounding structural semantics
        run: bash ci/test_phase5_mother_audio.sh
      - name: P5d Chain sounding boundary semantics
        run: bash ci/test_phase5_chain_audio.sh
      - name: P5e Chain continuous morph sounding semantics
        run: bash ci/test_phase5_chain_morph_audio.sh
      - name: P5f step-one free-run sounding semantics
        run: bash ci/test_phase5_step_one_audio.sh
      - name: P6 Space algorithm prototype
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic tools/p6_space_prototype.c -lm -o /tmp/p6_space_prototype
          /tmp/p6_space_prototype
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined tools/p6_space_prototype.c -lm -o /tmp/p6_space_prototype_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/p6_space_prototype_san
      - name: P6 shared room front-end/topology
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            apsis/apsis_state.c apsis/apsis_space_dsp.c apsis/apsis_space_room.c \
            tests/test_space_room.c -o /tmp/test_space_room
          /tmp/test_space_room
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -Iapsis \
            apsis/apsis_state.c apsis/apsis_space_dsp.c apsis/apsis_space_room.c \
            tests/test_space_room.c -o /tmp/test_space_room_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/test_space_room_san
