name: APSIS Phase 11N FDN line-read invariant proof

on:
  workflow_dispatch:

jobs:
  p11n-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: a13bce4ce821b68d8daab66ec1432ba3b5bf9a99

      - name: Gate P11N.1 - helper and complete-FDN equivalence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a13bce4ce821b68d8daab66ec1432ba3b5bf9a99'
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            tests/test_p11n_fdn_line_read_equivalence.c \
            -o /tmp/test_p11n_fdn_line_read_equivalence
          /tmp/test_p11n_fdn_line_read_equivalence | tee /tmp/p11n-proof.log
          grep -q 'PASS: P11N invariant-simplified line read is bit-identical' /tmp/p11n-proof.log
          grep -q 'P11N helper_cases=905504 full_render_blocks=3328 full_render_frames=210677' /tmp/p11n-proof.log

      - name: Gate P11N.2 - equivalence under ASAN and UBSAN
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis \
            tests/test_p11n_fdn_line_read_equivalence.c \
            -o /tmp/test_p11n_fdn_line_read_equivalence_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_p11n_fdn_line_read_equivalence_san | tee /tmp/p11n-proof-san.log
          grep -q 'PASS: P11N invariant-simplified line read is bit-identical' /tmp/p11n-proof-san.log
          grep -q 'P11N helper_cases=905504 full_render_blocks=3328 full_render_frames=210677' /tmp/p11n-proof-san.log

      - name: Gate P11N.3 - production Space sources remain exact P11L authority
        run: |
          set -euo pipefail
          test "$(git hash-object apsis/apsis_space_dsp.c)" = '0c472f3844210f0dfb3d31bf6dacf007272ac078'
          test "$(git hash-object apsis/apsis_space_dsp.h)" = '71afae3c4c52bbd735121597dfa7ad6cea4f32f5'
          test "$(git hash-object apsis/apsis_space_room.c)" = 'ee00267cbbaef04bb1eed963b7b5cb1c2cc46346'
          echo 'PASS: P11N proof has not modified production Space source or state layout'
