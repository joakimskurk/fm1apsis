name: APSIS Phase 10 Spiral Attractor active

on:
  push:
    branches: [p10-string-motion]
  pull_request:
  workflow_dispatch:

jobs:
  p10f-active:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi Linux toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"

      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Gate P10F.8 - pinned upstream and regressions
        run: bash ci/prepare_dinghy.sh

      - name: Gate P10F.9 - test-only active editor telemetry target
        run: bash ci/apply_apsis_p10f_probe.sh

      - name: Gate P10F.10 - real JieLi telemetry target
        run: |
          bash ci/build_apsis_target.sh
          mkdir -p build/evidence
          cp build/target_report.json build/evidence/p10-spiral-attractor-active-target-report.json
          cp build/SHA256SUMS build/evidence/p10-spiral-attractor-active-SHA256SUMS
          python3 - <<'PY'
          import json
          from pathlib import Path
          t = json.loads(Path('build/target_report.json').read_text())
          if t.get('product') != 'FM-1_972':
              raise SystemExit(f"FAIL: P10F active product {t.get('product')!r}")
          if t.get('ram', 0) > t.get('ram_max', 0):
              raise SystemExit(f"FAIL: P10F active RAM {t.get('ram')}/{t.get('ram_max')}")
          phase10_pool_ceiling = 309532 + 19208
          if t.get('pool', 0) > phase10_pool_ceiling:
              raise SystemExit(
                  f"FAIL: P10F active POOL {t.get('pool')} exceeds Phase-10 ceiling "
                  f"{phase10_pool_ceiling}"
              )
          if t.get('pool', 0) > t.get('pool_max', 0):
              raise SystemExit(f"FAIL: P10F active POOL {t.get('pool')}/{t.get('pool_max')}")
          print(f"PASS: P10F active telemetry target fits image={t.get('image')}/{t.get('image_max')} RAM={t.get('ram')}/{t.get('ram_max')} POOL={t.get('pool')}/{t.get('pool_max')} ceiling={phase10_pool_ceiling}")
          PY

      - name: Gate P10F.11 - physical editor lifecycle in pinned emulator
        run: |
          set -euo pipefail
          bash ci/emulator_spiral_attractor_active.sh build/apsis-0.1-dev.fwsc 2>&1 \
            | tee build/evidence/emulator_p10_spiral_attractor_active.txt
          cp -a work/emu-spiral-attractor-active build/evidence/emulator-spiral-attractor-active

      - name: Upload Phase 10F active evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p10-spiral-attractor-active-evidence
          path: build/evidence
          if-no-files-found: warn
