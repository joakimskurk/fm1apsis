name: APSIS Phase 11F Bloom slot reduction

# Historical read-only P11F acceptance gate. Authoritative green run
# 41324331937 on eb651e768a049a1b4a1e88397a9021fccc69fd30 proved the 48-slot
# candidate with exact host, JieLi target, idle-emulator and active-Motion gates.
# Manual reruns always check out that proven technical head so later Phase 11
# work cannot change the test and the answer together.
on:
  workflow_dispatch:

jobs:
  p11f-bloom-slots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: eb651e768a049a1b4a1e88397a9021fccc69fd30
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Python packages
        run: python3 -m pip install Pillow

      - name: Gate P11F.1 - full historical host and sanitizer behavior
        run: bash ci/p11f_prepare.sh

      - name: Gate P11F.2 - reduced-capacity exact stress and Bloom audio bridge
        run: |
          set -euo pipefail
          rm -rf /tmp/p11f-evidence
          mkdir -p /tmp/p11f-evidence

          build/test_runtime | tee /tmp/p11f-evidence/runtime.log
          build/test_runtime_extreme | tee /tmp/p11f-evidence/runtime_extreme.log
          build/test_string_attractor_runtime | tee /tmp/p11f-evidence/string_attractor_runtime.log

          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            build/apsis_*.o tests/test_p11_bloom_slot_bound.c \
            -o /tmp/test_p11f_bloom_bound
          /tmp/test_p11f_bloom_bound | tee /tmp/p11f-evidence/bloom_bound.log
          grep -q 'proven_max=44 current_cap=48' /tmp/p11f-evidence/bloom_bound.log

          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            build/apsis_*.o apsis/apsis_bloom_audio.c \
            apsis/apsis_bloom_audio_runtime.c tests/test_bloom_audio_runtime.c \
            -o /tmp/test_p11f_bloom_audio_runtime
          /tmp/test_p11f_bloom_audio_runtime | tee /tmp/p11f-evidence/bloom_audio_runtime.log

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis \
            apsis/apsis_state.c apsis/apsis_harmony.c apsis/apsis_gravity.c \
            apsis/apsis_string.c apsis/apsis_string_dsp.c \
            apsis/apsis_string_transient_pool.c apsis/apsis_string_rhythm_audio.c \
            apsis/apsis_string_attractor.c apsis/apsis_string_attractor_audio.c \
            apsis/apsis_drift.c apsis/apsis_drift_dsp.c \
            apsis/apsis_clock.c apsis/apsis_clock_dsp.c \
            apsis/apsis_spiral.c apsis/apsis_bloom.c apsis/apsis_keep.c \
            apsis/apsis_chain.c apsis/apsis_mother.c apsis/apsis_transport.c \
            apsis/apsis_late_binding.c apsis/apsis_runtime_m4c.c \
            apsis/apsis_space_dsp.c apsis/apsis_bloom_audio.c \
            apsis/apsis_bloom_audio_runtime.c tests/test_bloom_audio_runtime.c \
            -o /tmp/test_p11f_bloom_audio_runtime_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_p11f_bloom_audio_runtime_san

          python3 - <<'PY'
          from pathlib import Path
          rt=Path('/tmp/p11f-evidence/runtime.log').read_text()
          ex=Path('/tmp/p11f-evidence/runtime_extreme.log').read_text()
          at=Path('/tmp/p11f-evidence/string_attractor_runtime.log').read_text()
          assert 'sizeof=21032' in rt, rt
          assert 'bloom-slots=44/48' in ex, ex
          assert 'queue=357/512' in ex and 'spiral-slots=59/64' in ex, ex
          assert 'queue=415/512, pending=60/64' in at, at
          print('PASS: P11F host capacity changed only where authorized; high-water remains frozen')
          PY

      - name: JieLi Linux toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"

      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Gate P11F.3 - exact real JieLi production target
        run: |
          set -euo pipefail
          bash ci/apply_apsis_p10g.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json /tmp/p11f-evidence/production-target.json
          cp build/SHA256SUMS /tmp/p11f-evidence/production-SHA256SUMS
          python3 - <<'PY'
          import json
          r=json.load(open('build/target_report.json'))
          expected = {
              'product': 'FM-1_972',
              'image': 140408,
              'image_max': 581564,
              'ram': 87476,
              'ram_max': 98304,
              'pool': 319176,
              'pool_max': 344064,
              'ram_headroom': 10828,
              'pool_headroom': 24888,
              'package_bytes': 610110,
              'package_sha256': 'e0d0b826f0c2d5b8f1af781a9259b5d78dce9062939661ac7acad17bfefb78e5',
          }
          for k,v in expected.items():
              assert r[k] == v, (k, r[k], v, r)
          assert 89716-r['ram'] == 2240, r
          print('PASS: P11F exact production target, RAM saving 2240 B', r)
          PY

      - name: Gate P11F.4 - exact frozen inactive emulator behavior
        run: |
          set -euo pipefail
          APSIS_EMU_DYNAMIC_HOME=1 APSIS_EMU_EXPECT_CURSOR=123392 \
            bash ci/emulator_smoke.sh build/apsis-0.1-dev.fwsc 2>&1 \
            | tee /tmp/p11f-evidence/idle.log
          cp work/emu-smoke/report.json /tmp/p11f-evidence/idle-report.json
          python3 - <<'PY'
          import json
          r=json.load(open('work/emu-smoke/report.json'))
          assert r['wav_raw_sha256'] == 'c4fa18954cd5d5ecc895ec9457d673b8bdbe0f946c0d2aa3efa3d28f77c60f93', r
          assert r['runtime_cursor_low32'] == 123392, r
          assert r['runtime_queue_high_water'] == 28, r
          assert r['runtime_queue_overflowed'] == 0, r
          assert r['runtime_late_flags'] == 0, r
          assert r['runtime_late_trace_hash'] == '811c9dc5', r
          print('PASS: P11F exact frozen idle PCM/runtime')
          PY

      - name: Gate P11F.5 - exact reduced-capacity active Motion target
        run: |
          set -euo pipefail
          bash ci/p11f_prepare.sh
          bash ci/apply_apsis_p10d3_probe.sh
          bash ci/build_apsis_target.sh
          cp build/target_report.json /tmp/p11f-evidence/active-target.json
          cp build/SHA256SUMS /tmp/p11f-evidence/active-SHA256SUMS
          python3 - <<'PY'
          import json
          r=json.load(open('build/target_report.json'))
          expected = {
              'product': 'FM-1_972',
              'image': 137672,
              'image_max': 581564,
              'ram': 87524,
              'ram_max': 98304,
              'pool': 319176,
              'pool_max': 344064,
              'ram_headroom': 10780,
              'pool_headroom': 24888,
              'package_bytes': 610110,
              'package_sha256': '6dc05756b22dfbf7a825b1877207209a2cd667f8f0223fa56f5603a933ffe86c',
          }
          for k,v in expected.items():
              assert r[k] == v, (k, r[k], v, r)
          assert 89764-r['ram'] == 2240, r
          print('PASS: P11F exact active target, RAM saving 2240 B', r)
          PY

      - name: Gate P11F.6 - exact frozen active Motion lifecycle
        run: |
          set -euo pipefail
          bash ci/emulator_motion_active.sh build/apsis-0.1-dev.fwsc 2>&1 \
            | tee /tmp/p11f-evidence/active.log
          cp work/emu-motion-active/report.json /tmp/p11f-evidence/active-report.json
          cp work/emu-motion-active/apsis-motion.wav /tmp/p11f-evidence/active.wav

      - name: Upload P11F evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11f-bloom-slot-reduction-evidence
          path: /tmp/p11f-evidence
          if-no-files-found: warn
