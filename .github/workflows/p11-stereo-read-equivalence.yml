name: APSIS Phase 11I stereo-read equivalence proof

on:
  push:
    branches: [p11i-space-stereo-read-staging]
  workflow_dispatch:

jobs:
  p11i-equivalence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Gate P11I.1 - candidate equals current single-channel authority
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iapsis \
            apsis/apsis_space_dsp.c tests/test_p11i_stereo_read_equivalence.c \
            -o /tmp/test_p11i_stereo_read_equivalence
          /tmp/test_p11i_stereo_read_equivalence | tee /tmp/p11i-equivalence.log
          grep -q 'PASS: P11I candidate stereo-pair reader is bit-identical' \
            /tmp/p11i-equivalence.log

      - name: Gate P11I.2 - equivalence under ASAN and UBSAN
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -Iapsis \
            apsis/apsis_space_dsp.c tests/test_p11i_stereo_read_equivalence.c \
            -o /tmp/test_p11i_stereo_read_equivalence_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test_p11i_stereo_read_equivalence_san \
            | tee /tmp/p11i-equivalence-san.log
          grep -q 'PASS: P11I candidate stereo-pair reader is bit-identical' \
            /tmp/p11i-equivalence-san.log

      - name: Gate P11I.3 - frozen historical host behavior remains green
        run: bash ci/p11f_prepare.sh

      - name: Gate P11I.4 - prove production room source is still untouched
        run: |
          set -euo pipefail
          EXPECTED_BLOB=2d7c34e32b48b904623d740a70cf657fee0801a7
          ACTUAL_BLOB="$(git hash-object apsis/apsis_space_room.c)"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          grep -q 'static int32_t space_room_stereo_read' apsis/apsis_space_room.c
          if grep -q 'space_room_stereo_read_pair' apsis/apsis_space_room.c; then
            echo 'FAIL: candidate entered production before equivalence phase finished' >&2
            exit 1
          fi
          echo "PASS: production Cathedral room source remains frozen at blob $ACTUAL_BLOB"
